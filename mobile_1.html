async function exportJSON() {
  state.settings.lastBackup = todayISO();
  save();
  const data = JSON.stringify(state, null, 2);
  const fname = 'budget_sauvegarde_' + todayISO() + '.json';
  try {
    const file = new File([data], fname, { type: 'application/json' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title: fname });
      toast('Choisis OneDrive pour enregistrer');
      render();
      return;
    }
  } catch (e) {
    if (e && e.name === 'AbortError') return;
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([data], { type: 'application/json' }));
  a.download = fname;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  toast('Sauvegarde exportée');
  render();
}

function importJSON(ev) {
  const f = ev.target.files[0];
  ev.target.value = '';
  if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    let data;
    try {
      data = JSON.parse(r.result);
    } catch (e) {
      return toast('Fichier JSON illisible');
    }
    if (!data || typeof data !== 'object' || (!('settings' in data) && !('recurring' in data))) {
      return toast('Format de sauvegarde non reconnu');
    }
    state = data;
    normalizeState();
    commit('Sauvegarde importée (' + state.recurring.length + ' récurrentes, ' + state.oneoffs.length + ' ponctuelles)');
  };
  r.onerror = () => toast('Lecture du fichier impossible');
  r.readAsText(f);
}

function csvParse(text) {
  const first = text.split(/\r?\n/)[0] || '';
  const sep = (first.match(/;/g) || []).length > (first.match(/,/g) || []).length ? ';' : ',';
  const lines = text.trim().split(/\r?\n/).filter(Boolean);
  const headers = lines.shift().split(sep).map((h) => h.trim().replace(/^"|"$/g, '').toLowerCase());
  return lines.map((line) => {
    const vals = line.split(sep).map((v) => v.trim().replace(/^"|"$/g, ''));
    const o = {};
    headers.forEach((h, i) => { o[h] = vals[i] || ''; });
    return o;
  });
}

function isIncomeType(t) {
  t = String(t || '').toLowerCase();
  return t.includes('entr') || t.includes('income') || t.includes('reven');
}

function importCSV(ev) {
  const f = ev.target.files[0];
  ev.target.value = '';
  if (!f) return;
  const type = fv('csv_type');
  const replace = $('csv_replace').checked;
  const r = new FileReader();
  r.onload = () => {
    const rows = csvParse(r.result);
    if (replace && !confirm('Remplacer les éléments existants de ce type par le contenu du fichier ?')) return;
    let count = 0;

    if (type === 'recurring') {
      if (replace) {
        const hasInc = rows.some((x) => isIncomeType(x.type));
        const hasExp = rows.some((x) => !isIncomeType(x.type));
        state.recurring = state.recurring.filter((x) => (x.type === 'income' ? !hasInc : !hasExp));
      }
      rows.forEach((x) => {
        if (isIncomeType(x.type)) {
          const plan = (x.planning || x.schedule || '').trim();
          let sched = [];
          if (plan) {
            sched = plan.split('|').map((p) => {
              const a = p.split(':');
              return { ym: (a[0] || '').trim(), amount: parseAmount(a[1]) };
            }).filter((s) => s.ym && s.amount);
          } else if (parseAmount(x.montant || x.amount) > 0) {
            sched = genMonths(todayISO().slice(0, 7), 18, parseAmount(x.montant || x.amount));
          }
          state.recurring.push({
            id: uid(), type: 'income', label: x.libelle || x.label || 'Entrée',
            category: x.categorie || x.category || 'Autres', day: Number(x.jour || x.day || 27), schedule: sched,
          });
        } else {
          state.recurring.push({
            id: uid(), type: 'expense', label: x.libelle || x.label || 'Sans libellé',
            amount: parseAmount(x.montant || x.amount), day: Number(x.jour || x.day || 5),
            category: x.categorie || x.category || 'Divers', start: x.date_debut || x.start || todayISO(), end: x.date_fin || x.end || '',
          });
        }
        count++;
      });
    }
    if (type === 'oneoff') {
      if (replace) state.oneoffs = [];
      rows.forEach((x) => {
        state.oneoffs.push({
          id: uid(), type: isIncomeType(x.type) ? 'income' : 'expense', label: x.libelle || x.label || 'Sans libellé',
          amount: parseAmount(x.montant || x.amount), date: x.date || todayISO(), category: x.categorie || x.category || 'Divers',
        });
        count++;
      });
    }
    if (type === 'savings') {
      if (replace) state.savings = [];
      rows.forEach((x) => {
        state.savings.push({
          id: uid(), kind: 'objectif', label: x.libelle || x.label || 'Objectif', target: parseAmount(x.cible || x.target),
          opening: parseAmount(x.actuel || x.current), ops: [], priority: Number(x.priorite || x.priority || 1),
          start: x.date_debut || x.start || todayISO(), due: x.date_echeance || x.due || '',
          monthly: parseAmount(x.versement_mensuel || x.monthly), active: true,
        });
        count++;
      });
    }
    if (type === 'courses') {
      if (replace) state.courses = [];
      count = addCourseRows(rows);
    }
    normalizeState();
    commit(count + ' ligne(s) importée(s)');
  };
  r.readAsText(f);
}

function resetAll() {
  if (!confirm('Effacer toutes les données de ce téléphone ? Pense à exporter avant.')) return;
  try { localStorage.removeItem(STORAGE_KEY); } catch (e) { /* rien */ }
  state = defaultState();
  commit('Données effacées');
}

const GOAL_KINDS = { objectif: 'Objectif', charge: 'Charge', precaution: 'Précaution', tampon: 'Tampon' };

function renderSavingsPage() {

    + '</div>'

  html += goals.length ? goals.map(goalCardHTML).join('') : '<div class="empty">Aucune enveloppe pour l’instant.</div>';

function saveSavingStrategy() {
  state.settings.savingMode = fv('sv_mode');
  state.settings.savingEnvelope = parseAmount(fv('sv_env'));
  commit();
}

function goalCardHTML(g) {
  const bal = gBalance(g);
  const tgt = gTarget(g);
  const rem = gRemaining(g);
  const st = gStatus(g);
  const planned = gPlanned(g);
  const ml = gMonthsLeft(g);
  const finish = gFinishDate(g);
  const ideal = gIdeal(g);
  const due = gDue(g);
  const L = [];

  if (g.kind === 'tampon') {
    L.push('Disponible : <b>' + euro(bal) + '</b>');
    if (Number(g.lowThreshold)) L.push('Seuil bas : ' + euro(g.lowThreshold));
  } else {
    L.push('<b>' + euro(bal) + '</b> / ' + euro(tgt) + ' · reste ' + euro(rem));
    if (g.kind === 'precaution') {
      const mc = monthlyCharges();
      L.push('Couvre ' + (mc > 0 ? (bal / mc).toFixed(1) : '—') + ' mois de charges sur ' + (g.monthsCover || 0) + ' visés');
    }
    if (rem > 0) {
      if (ml != null) L.push((g.kind === 'charge' ? 'À provisionner' : 'Effort requis') + ' : <b>' + euro(gRequired(g)) + '/mois</b> · échéance ' + fmtDate(due) + ' (' + ml + ' mois)');
      else L.push('Versement prévu : <b>' + euro(planned) + '/mois</b>');
      if (ideal != null) L.push((bal >= ideal ? 'En avance de ' : 'En retard de ') + '<b>' + euro(Math.abs(bal - ideal)) + '</b> sur la trajectoire');
      if (finish) L.push('À ce rythme : atteint le ' + fmtDate(iso(finish)) + (due && iso(finish) > due ? ' <span class="pill warn">après l’échéance</span>' : ''));
    } else {
      L.push('🎉 ' + (g.kind === 'charge' ? 'Charge provisionnée' : 'Objectif atteint'));
    }
  }
  if (g.kind !== 'tampon' && planned > 0) {
    const m = todayISO().slice(0, 7);
    const done = (g.ops || []).some((o) => o.type === 'in' && (o.date || '').slice(0, 7) === m);
    L.push('Versement du mois : ' + (done ? '<span class="pill pos">fait</span>' : '<span class="pill warn">à faire</span>'));
  }

  const ops = (g.ops || []).slice().sort((a, b) => b.date.localeCompare(a.date));
  const btn = (label, call, cls) => '<button class="btn sm ' + (cls || 'ghost') + '" type="button" onclick="' + call + '">' + label + '</button>';
  const btns = [btn('+ Versement', "gOp('" + g.id + "','in')", 'success'), btn('− Retrait', "gOp('" + g.id + "','out')"), btn('Ajuster', "gOp('" + g.id + "','set')")];
  if (g.kind !== 'tampon' && planned > 0) btns.push(btn('✓ Mois', "gMonthlyContribution('" + g.id + "')"));
  if (g.kind === 'charge') btns.push(btn('Payer', "gPayCharge('" + g.id + "')"));
  btns.push(btn('Virement', "gTransfer('" + g.id + "')"), btn('Paramètres', "editGoal('" + g.id + "')"));

  return '<div class="card"><div class="row between"><div class="t" style="font-weight:750">' + esc(g.label)
    + ' <span class="pill grey">' + (GOAL_KINDS[g.kind] || 'Objectif') + '</span></div><span class="pill ' + st.cls + '">' + st.label + '</span></div>'
    + (tgt > 0 ? '<div class="progress"><i style="width:' + gPct(g) + '%"></i></div>' : '')
    + L.map((l) => '<div class="muted" style="margin-top:3px">' + l + '</div>').join('')
    + goalChartSVG(g)
    + '<div class="row wrap" style="margin-top:10px">' + btns.join('') + '</div>'
    + '<details style="margin-top:10px"><summary class="muted">Historique (' + ops.length + ')</summary><table class="mini" style="margin-top:6px">'
    + (ops.length ? ops.map((o) => '<tr><td>' + fmtShort(o.date) + '</td><td>' + (o.type === 'in' ? 'Versement' : o.type === 'out' ? 'Retrait' : 'Ajust.')
      + (o.note ? '<div class="muted">' + esc(o.note) + '</div>' : '') + '</td><td class="r ' + (o.amount >= 0 ? 'pos' : 'neg') + '">'
      + (o.amount >= 0 ? '+' : '') + euro(o.amount) + '</td><td class="r"><button class="btn sm ghost" type="button" onclick="gDelOp(\'' + g.id + '\',\'' + o.id + '\')">✕</button></td></tr>').join('')
      : '<tr><td class="muted">Aucun mouvement.</td></tr>')
    + '</table></details></div>';
}

    + '<div>' + field('Solde initial (€)', amountInput('g_opening', v('opening', 0))) + '</div></div>'

    + (g ? '<button class="btn block danger" type="button" style="margin-top:8px" onclick="deleteItem(\'savings\',\'' + g.id + '\')">Supprimer l’enveloppe</button>' : '');

function goalKindChange() {
  const k = fv('g_kind');
  document.querySelectorAll('#sheetBody [data-k]').forEach((el) => {
    el.classList.toggle('hidden', !el.dataset.k.split(' ').includes(k));
  });
}

function saveGoal(id) {
  const kind = fv('g_kind');
  const data = {
    kind,
    label: fv('g_label').trim() || 'Enveloppe',
    opening: parseAmount(fv('g_opening')),
    target: kind === 'objectif' || kind === 'charge' ? parseAmount(fv('g_target')) : 0,
    priority: Number(fv('g_prio')) || 1,
    start: kind === 'tampon' ? '' : fv('g_start') || todayISO(),
    due: kind === 'tampon' ? '' : fv('g_due'),
    monthly: kind === 'charge' ? 0 : parseAmount(fv('g_monthly')),
    recurrence: fv('g_recur') || 'once',
    monthsCover: Number(fv('g_cover')) || 0,
    lowThreshold: parseAmount(fv('g_low')),
  };
  if ((kind === 'objectif' || kind === 'charge') && !data.target) return toast('Montant cible manquant');
  if (kind === 'precaution' && !data.monthsCover) return toast('Nombre de mois manquant');
  if (id) Object.assign(state.savings.find((x) => x.id === id), data);
  else state.savings.push(Object.assign({ id: uid(), ops: [], active: true }, data));
  closeSheet();
  commit('Enveloppe enregistrée');
}

function findGoal(id) {
  return state.savings.find((x) => x.id === id);
}

function gOp(id, type) {
  const g = findGoal(id);
  if (!g) return;
  if (type === 'set') {
    const v = prompt('Solde réellement disponible dans « ' + g.label + ' » (€) :', String(gBalance(g)));
    if (v == null) return;
    const nb = parseAmount(v);
    g.ops.push({ id: uid(), date: todayISO(), type: 'set', amount: nb - gBalance(g), note: 'Ajustement à ' + euro(nb) });
  } else {
    const v = prompt((type === 'in' ? 'Versement' : 'Retrait') + ' sur « ' + g.label + ' » (€) :', '');
    if (v == null) return;
    const amount = Math.abs(parseAmount(v));
    if (!amount) return;
    const note = (prompt('Note (facultatif) :', '') || '').trim();
    g.ops.push({ id: uid(), date: todayISO(), type, amount: type === 'in' ? amount : -amount, note });
  }
  commit('Mouvement enregistré');
}

function gDelOp(gid, oid) {
  const g = findGoal(gid);
  if (!g || !confirm('Supprimer ce mouvement ?')) return;
  g.ops = g.ops.filter((o) => o.id !== oid);
  commit();
}

function gTransfer(fromId) {
  const from = findGoal(fromId);
  const others = state.savings.filter((x) => x.id !== fromId);
  if (!others.length) return toast('Aucune autre enveloppe');
  const v = prompt('Montant à transférer depuis « ' + from.label + ' » (€) :', '');
  const amount = Math.abs(parseAmount(v));
  if (!amount) return;
  const pick = prompt('Vers quelle enveloppe ? Numéro :\n' + others.map((g, i) => (i + 1) + '. ' + g.label).join('\n'), '1');
  const to = others[Number(pick) - 1];
  if (!to) return toast('Choix invalide');
  from.ops.push({ id: uid(), date: todayISO(), type: 'out', amount: -amount, note: 'Virement → ' + to.label });
  to.ops.push({ id: uid(), date: todayISO(), type: 'in', amount, note: 'Virement ← ' + from.label });
  commit('Virement effectué');
}

function gMonthlyContribution(id) {
  const g = findGoal(id);
  const amt = Math.round(gPlanned(g) * 100) / 100;
  if (amt <= 0) return toast('Aucun versement planifié');
  g.ops.push({ id: uid(), date: todayISO(), type: 'in', amount: amt, note: 'Versement du mois' });
  commit('Versement du mois : ' + euro(amt));
}

function gPayCharge(id) {
  const g = findGoal(id);
  const bal = gBalance(g);
  if (bal <= 0) return toast('Enveloppe vide');
  if (!confirm('Marquer « ' + g.label + ' » comme payée et vider l’enveloppe (' + euro(bal) + ') ?')) return;
  g.ops.push({ id: uid(), date: todayISO(), type: 'out', amount: -bal, note: 'Charge payée' });
  commit('Charge payée');
}

function openGoalSim() {
  const goals = state.savings.filter((g) => g.kind !== 'tampon');
  if (!goals.length) return toast('Aucune enveloppe avec cible');
  const html = field('Enveloppe', selectHTML('sim_goal', goals.map((g) => [g.id, g.label]), goals[0].id))
    + '<div class="grid2"><div>' + field('Je verse (€/mois)', amountInput('sim_amt', '')) + '</div><div>'
    + field('… ou j’atteins le', input('sim_date', 'type="date"')) + '</div></div>'
    + '<button class="btn block" type="button" style="margin-top:14px" onclick="runGoalSim()">Calculer</button>'
    + '<div id="sim_out" class="alert ok" style="margin-top:12px">Choisis un montant mensuel et/ou une date.</div>';
  openSheet('Simulateur d’épargne', html);
}

function runGoalSim() {
  const g = findGoal(fv('sim_goal'));
  const rem = gRemaining(g);
  const out = [];
  if (rem <= 0) {
    $('sim_out').innerHTML = 'Objectif déjà atteint 🎉';
    return;
  }
  const amt = parseAmount(fv('sim_amt'));
  const date = fv('sim_date');
  if (amt > 0) {
    const months = Math.ceil(rem / amt);
    out.push('À ' + euro(amt) + '/mois : atteint en <b>' + months + ' mois</b> (≈ ' + fmtDate(iso(addMonthsDate(new Date(), months))) + ').');
  }
  if (date) {
    const ml = Math.max(1, monthDiff(new Date(), dateObj(date)) + 1);
    out.push('Pour le ' + fmtDate(date) + ' (' + ml + ' mois) : verser <b>' + euro(rem / ml) + '/mois</b>.');
  }
  $('sim_out').innerHTML = out.length ? out.join('<br>') : 'Renseigne un montant ou une date.';
}

function norm(s) {
  return String(s || '').trim().toLowerCase().replace(/\s+/g, ' ');
}

function ppu(c) {
  return c.qty && c.qty > 0 ? c.price / c.qty : null;
}

function uniqueSorted(arr) {
  return [...new Set(arr.filter(Boolean))].sort((a, b) => a.localeCompare(b));
}

function coursesStores() {
  return uniqueSorted(state.courses.map((c) => c.store));
}

function coursesCategories() {
  return uniqueSorted(state.courses.map((c) => c.category));
}

    + '<div class="grid3">' + stat('Produits', String(products)) + stat('Relevés', String(state.courses.length)) + stat('Enseignes', String(coursesStores().length)) + '</div>'
    + '<div class="grid2"><button class="btn" type="button" onclick="openPriceSheet()">Ajouter un prix</button>'
    + '<label class="btn ghost" style="display:grid;place-items:center">Importer CSV<input type="file" accept=".csv,text/csv" class="hidden" onchange="importCoursesCSV(event)"></label></div>'
    + basketCardHTML()
    + panierCardHTML()
    + '<div class="card"><h2>Comparer et rechercher</h2>'
    + input('c_q', 'type="search" placeholder="Rechercher un produit" value="' + esc(coursesUI.q) + '" style="margin-top:10px" oninput="coursesUI.q=this.value;renderCourseResults()"')
    + '<div class="grid2" style="margin-top:8px">'
    + selectHTML('c_cat', [['', 'Toutes catégories']].concat(coursesCategories()), coursesUI.cat, 'onchange="coursesUI.cat=this.value;renderCourseResults()"')
    + selectHTML('c_store', [['', 'Toutes enseignes']].concat(coursesStores()), coursesUI.store, 'onchange="coursesUI.store=this.value;renderCourseResults()"')
    + '</div>' + selectHTML('c_sort', [['name', 'Tri : nom'], ['price', 'Tri : prix'], ['ppu', 'Tri : prix à l’unité'], ['store', 'Tri : enseigne'], ['date', 'Tri : plus récent']], coursesUI.sort, 'style="margin-top:8px" onchange="coursesUI.sort=this.value;renderCourseResults()"')
    + '</div>'
    + '<div id="c_results">' + courseResultsHTML() + '</div>'
    + '</div>';
}

function renderCourseResults() {
  const el = $('c_results');
  if (el) el.innerHTML = courseResultsHTML();
}

function courseResultsHTML() {
  return compareCardHTML() + priceListCardHTML();
}

/* ---------- Budget hebdomadaire ---------- */

function openGrocerySheet() {
  const g = state.settings.grocery || {};
  const html =
    '<div class="muted">Une dépense chaque semaine, intégrée à la prévision.</div>'
    + '<div class="grid2"><div>' + field('Montant par plein (€)', amountInput('gr_amount', g.amount || ''))
    + '</div><div>' + field('Jour', selectHTML('gr_day', WEEKDAYS, g.weekday != null ? g.weekday : 6)) + '</div></div>'
    + field('À partir du (facultatif)', input('gr_start', 'type="date" value="' + (g.start || '') + '"'))
    + '<label class="row" style="margin-top:14px;gap:10px"><input type="checkbox" id="gr_active"' + (g.active ? ' checked' : '') + '><span>Activer</span></label>'
    + '<button class="btn block" type="button" style="margin-top:16px" onclick="saveGrocery()">Enregistrer</button>';
  openSheet('Budget courses hebdo', html);
}

function saveGrocery() {
  state.settings.grocery = {
    active: $('gr_active').checked,
    amount: parseAmount(fv('gr_amount')),
    weekday: Number(fv('gr_day')),
    label: 'Plein de courses',
    start: fv('gr_start') || '',
  };
  closeSheet();
  commit('Budget courses enregistré');
}

/* ---------- Relevés de prix ---------- */

function openPriceSheet() {
  const dl = (id, arr) => '<datalist id="' + id + '">' + arr.map((x) => '<option value="' + esc(x) + '">').join('') + '</datalist>';
  const html =
    field('Produit', input('p_product', 'list="dl_products" placeholder="Ex. Lait demi-écrémé"'))
    + '<div class="grid2"><div>' + field('Catégorie', input('p_cat', 'list="dl_ccats" placeholder="Produits laitiers"'))
    + '</div><div>' + field('Enseigne', input('p_store', 'list="dl_stores" placeholder="Lidl, Auchan…"')) + '</div></div>'
    + '<div class="grid3"><div>' + field('Prix (€)', amountInput('p_price', ''))
    + '</div><div>' + field('Quantité', input('p_qty', 'type="text" inputmode="decimal" placeholder="1"'))
    + '</div><div>' + field('Unité', input('p_unit', 'placeholder="L, kg, pc"')) + '</div></div>'
    + field('Date du relevé', input('p_date', 'type="date" value="' + todayISO() + '"'))
    + '<div class="muted" style="margin-top:6px">Quantité + unité permettent de comparer au litre ou au kilo.</div>'
    + '<button class="btn block" type="button" style="margin-top:16px" onclick="savePrice()">Enregistrer le prix</button>'
    + dl('dl_products', uniqueSorted(state.courses.map((c) => c.product))) + dl('dl_ccats', coursesCategories()) + dl('dl_stores', coursesStores());
  openSheet('Ajouter un prix', html);
}

function savePrice() {
  const product = fv('p_product').trim();
  const price = parseAmount(fv('p_price'));
  if (!product) return toast('Produit manquant');
  if (!price) return toast('Prix manquant');
  state.courses.push({
    id: uid(), product, price,
    category: fv('p_cat').trim() || 'Divers',
    store: fv('p_store').trim() || 'Sans enseigne',
    qty: parseAmount(fv('p_qty')) || null,
    unit: fv('p_unit').trim(),
    date: fv('p_date') || todayISO(),
  });
  closeSheet();
  commit('Prix ajouté');
}

function addCourseRows(rows) {
  let count = 0;
  rows.forEach((x) => {
    const product = (x.produit || x.product || x.libelle || x.label || '').trim();
    const price = parseAmount(x.prix || x.price);
    if (!product || !price) return;
    state.courses.push({
      id: uid(), product, price,
      category: (x.categorie || x.category || 'Divers').trim(),
      store: (x.enseigne || x.store || x.magasin || 'Sans enseigne').trim(),
      qty: parseAmount(x.quantite || x.qty || x.quantity) || null,
      unit: (x.unite || x.unit || '').trim(),
      date: x.date || todayISO(),
    });
    count++;
  });
  return count;
}

function importCoursesCSV(ev) {
  const f = ev.target.files[0];
  ev.target.value = '';
  if (!f) return;
  const r = new FileReader();
  r.onload = () => commit(addCourseRows(csvParse(r.result)) + ' prix importé(s)');
  r.readAsText(f);
}

function filteredCourses() {
  const q = norm(coursesUI.q);
  const rows = state.courses.filter((c) => (!q || norm(c.product).includes(q))
    && (!coursesUI.cat || c.category === coursesUI.cat)
    && (!coursesUI.store || c.store === coursesUI.store));
  const s = coursesUI.sort;
  rows.sort((a, b) => {
    if (s === 'price') return a.price - b.price;
    if (s === 'ppu') return (ppu(a) ?? 1e12) - (ppu(b) ?? 1e12);
    if (s === 'store') return a.store.localeCompare(b.store) || a.product.localeCompare(b.product);
    if (s === 'date') return b.date.localeCompare(a.date);
    return a.product.localeCompare(b.product) || a.price - b.price;
  });
  return rows;
}

function priceListCardHTML() {
  const rows = filteredCourses();
  return '<div class="card" style="margin-top:12px"><div class="card-head"><h2>Relevés</h2><span class="pill">' + rows.length + '</span></div>'
    + (rows.length ? '<div class="list">' + rows.map((c) => {
      const u = ppu(c);
      return '<div class="li"><div class="main"><div class="t">' + esc(c.product) + '</div><div class="s">' + esc(c.store) + ' · '
        + fmtShort(c.date) + (c.qty ? ' · ' + c.qty + esc(c.unit) : '') + (u ? ' · ' + euro(u) + '/' + esc(c.unit || 'u') : '') + '</div></div>'
        + '<div class="amt">' + euro(c.price) + '</div>'
        + '<button class="btn sm ghost" type="button" aria-label="Supprimer" onclick="deleteCourse(\'' + c.id + '\')">✕</button></div>';
    }).join('') + '</div>' : '<div class="empty">Aucun relevé.</div>') + '</div>';
}

function deleteCourse(id) {
  if (!confirm('Supprimer ce relevé ?')) return;
  state.courses = state.courses.filter((c) => c.id !== id);
  commit();
}

/* ---------- Comparateur ---------- */

/** Dernier prix connu de chaque produit dans chaque enseigne. */
function latestPrices() {
  const map = {};
  state.courses.forEach((c) => {
    const k = norm(c.product);
    if (!map[k]) map[k] = { label: c.product, category: c.category, stores: {} };
    const cur = map[k].stores[c.store];
    if (!cur || c.date > cur.date) map[k].stores[c.store] = { price: c.price, ppu: ppu(c), unit: c.unit, date: c.date };
  });
  return map;
}

function compareCardHTML() {
  const q = norm(coursesUI.q);
  const list = Object.values(latestPrices())
    .filter((g) => Object.keys(g.stores).length >= 2 && (!q || norm(g.label).includes(q)) && (!coursesUI.cat || g.category === coursesUI.cat))
    .map((g) => {
      const arr = Object.entries(g.stores).map(([store, v]) => Object.assign({ store }, v)).sort((a, b) => a.price - b.price);
      return Object.assign(g, { arr, saving: arr[arr.length - 1].price - arr[0].price, max: arr[arr.length - 1].price });
    })
    .sort((a, b) => b.saving - a.saving);

  return '<div class="card" style="margin-top:12px"><div class="card-head"><h2>Comparateur</h2><span class="pill">' + list.length + '</span></div>'
    + (list.length ? list.map((g) => '<div style="padding:8px 0;border-bottom:1px solid var(--line)"><div class="row between"><b>' + esc(g.label) + '</b>'
      + '<span class="pill pos">−' + euro(g.saving) + ' (' + Math.round((g.saving / g.max) * 100) + ' %)</span></div>'
      + '<table class="mini">' + g.arr.map((a, i) => '<tr><td>' + esc(a.store) + (i === 0 ? ' ✓' : '') + '</td><td class="r"><b>' + euro(a.price)
        + '</b></td><td class="r muted">' + (a.ppu ? euro(a.ppu) + '/' + esc(a.unit || 'u') : '—') + '</td></tr>').join('') + '</table></div>').join('')
      : '<div class="empty">Relève le même produit dans plusieurs enseignes pour comparer.</div>') + '</div>';
}

/* ---------- Liste de courses ---------- */

function priceFor(key, store) {
  const g = latestPrices()[key];
  return g && g.stores[store] ? g.stores[store].price : null;
}

function cheapestFor(key) {
  const g = latestPrices()[key];
  if (!g) return null;
  let best = null;
  Object.entries(g.stores).forEach(([store, v]) => { if (!best || v.price < best.price) best = { store, price: v.price }; });
  return best;
}

function basketByStore() {
  return coursesStores().map((store) => {
    let total = 0;
    let have = 0;
    const missing = [];
    state.basket.forEach((it) => {
      const p = priceFor(it.key, store);
      if (p == null) missing.push(it.label);
      else { total += p * it.qty; have++; }
    });
    return { store, total, have, count: state.basket.length, missing };
  }).filter((s) => s.have > 0).sort((a, b) => {
    const ac = a.have === a.count;
    const bc = b.have === b.count;
    if (ac !== bc) return ac ? -1 : 1;
    return a.total - b.total;
  });
}

function basketOptimal() {
  let total = 0;
  const missing = [];
  state.basket.forEach((it) => {
    const best = cheapestFor(it.key);
    if (!best) missing.push(it.label);
    else total += best.price * it.qty;
  });
  return { total, missing };
}

function basketCardHTML() {
  const items = state.basket;
  const byStore = basketByStore();
  const opt = basketOptimal();
  let html = '<div class="card"><div class="card-head"><h2>Liste de courses</h2><span class="pill">' + items.length + '</span></div>'
    + '<div class="row">' + input('b_product', 'list="dl_bproducts" placeholder="Ajouter un produit" style="flex:1"')
    + input('b_qty', 'type="number" inputmode="numeric" min="1" value="1" style="width:64px"')
    + '<button class="btn" type="button" onclick="addToBasket()">+</button></div>'
    + '<datalist id="dl_bproducts">' + uniqueSorted(state.courses.map((c) => c.product)).map((p) => '<option value="' + esc(p) + '">').join('') + '</datalist>';

  if (!items.length) return html + '<div class="empty" style="margin-top:10px">Liste vide.</div></div>';

  html += '<div class="list" style="margin-top:6px">' + items.map((it) => {
    const best = cheapestFor(it.key);
    return '<div class="li"><div class="main"><div class="t">' + esc(it.label) + '</div><div class="s">'
      + (best ? euro(best.price) + ' · ' + esc(best.store) : 'prix inconnu') + '</div></div>'
      + '<button class="btn sm ghost" type="button" onclick="basketQty(\'' + it.id + '\',-1)">−</button><b class="num">' + it.qty + '</b>'
      + '<button class="btn sm ghost" type="button" onclick="basketQty(\'' + it.id + '\',1)">+</button></div>';
  }).join('') + '</div>';

  const options = [['__opt__', 'Mix optimal']].concat(byStore.map((s) => [s.store, s.store + (s.have === s.count ? '' : ' (incomplet)')]));
  if (!options.some((o) => o[0] === coursesUI.basketStore)) {
    const complete = byStore.find((s) => s.have === s.count);
    coursesUI.basketStore = complete ? complete.store : '__opt__';
  }
  const chosen = coursesUI.basketStore === '__opt__' ? opt : byStore.find((s) => s.store === coursesUI.basketStore);
  const total = chosen ? chosen.total : 0;

  html += field('Estimer le plein chez', selectHTML('b_store', options, coursesUI.basketStore, 'onchange="coursesUI.basketStore=this.value;render()"'))
    + '<div class="row between" style="margin-top:10px"><span class="muted">Coût estimé' + (chosen && chosen.missing.length ? ' · ' + chosen.missing.length + ' sans prix' : '') + '</span>'
    + '<b class="num" style="font-size:22px">' + euro(total) + '</b></div>'
    + (byStore.length ? '<div class="list">' + byStore.map((s) => '<div class="li"><div class="main"><div class="t">' + esc(s.store) + '</div><div class="s">'
      + s.have + '/' + s.count + ' produits</div></div><div class="amt">' + euro(s.total) + '</div></div>').join('')
      + '<div class="li"><div class="main"><div class="t">Mix optimal</div><div class="s">le moins cher produit par produit</div></div><div class="amt pos">' + euro(opt.total) + '</div></div></div>' : '')
    + '<div class="grid2" style="margin-top:10px"><button class="btn success" type="button" onclick="basketToBudget()">Ajouter au budget</button>'
    + '<button class="btn ghost" type="button" onclick="clearBasket()">Vider</button></div></div>';
  return html;
}

function addToBasket() {
  const label = fv('b_product').trim();
  if (!label) return toast('Produit manquant');
  const qty = Math.max(1, Number(fv('b_qty')) || 1);
  const key = norm(label);
  const ex = state.basket.find((x) => x.key === key);
  if (ex) ex.qty += qty;
  else state.basket.push({ id: uid(), key, label, qty });
  commit();
}

function basketQty(id, d) {
  const it = state.basket.find((x) => x.id === id);
  if (!it) return;
  it.qty += d;
  if (it.qty <= 0) state.basket = state.basket.filter((x) => x.id !== id);
  commit();
}

function clearBasket() {
  if (!state.basket.length || !confirm('Vider la liste de courses ?')) return;
  state.basket = [];
  commit('Liste vidée');
}

function basketToBudget() {
  const isOpt = coursesUI.basketStore === '__opt__';
  const chosen = isOpt ? basketOptimal() : basketByStore().find((s) => s.store === coursesUI.basketStore);
  const total = chosen ? chosen.total : 0;
  if (!total) return toast('Aucun prix connu pour cette liste');
  state.oneoffs.push({
    id: uid(), type: 'expense', label: 'Courses (' + (isOpt ? 'mix optimal' : coursesUI.basketStore) + ')',
    amount: Math.round(total * 100) / 100, date: todayISO(), category: 'Courses',
  });
  commit('Plein ajouté au budget : ' + euro(total));
}

/* ---------- Paniers habituels ---------- */

function panierCardHTML() {
  return '<div class="card"><div class="card-head"><h2>Paniers habituels</h2><span class="pill">' + state.paniers.length + '</span></div>'
    + '<div class="row">' + input('pn_name', 'placeholder="Nom pour la liste actuelle" style="flex:1"')
    + '<button class="btn ghost" type="button" onclick="saveCurrentBasket()">Enregistrer</button></div>'
    + (state.paniers.length ? '<div class="list" style="margin-top:6px">' + state.paniers.map((p) => {
      const t = sum(p.items, (it) => { const b = cheapestFor(it.key); return b ? b.price * it.qty : 0; });
      return '<div class="li"><div class="main"><div class="t">' + esc(p.name) + '</div><div class="s">' + p.items.length + ' produit(s)'
        + (t ? ' · ≈ ' + euro(t) : '') + '</div></div>'
        + '<button class="btn sm" type="button" onclick="loadPanier(\'' + p.id + '\')">Charger</button>'
        + '<button class="btn sm ghost" type="button" onclick="addPanierToBasket(\'' + p.id + '\')">+</button>'
        + '<button class="btn sm ghost" type="button" aria-label="Supprimer" onclick="delPanier(\'' + p.id + '\')">✕</button></div>';
    }).join('') + '</div>' : '') + '</div>';
}

function saveCurrentBasket() {
  if (!state.basket.length) return toast('La liste est vide');
  const name = fv('pn_name').trim() || 'Panier ' + (state.paniers.length + 1);
  state.paniers.push({ id: uid(), name, created: todayISO(), items: state.basket.map((it) => ({ key: it.key, label: it.label, qty: it.qty })) });
  commit('Panier enregistré');
}

function loadPanier(id) {
  const p = state.paniers.find((x) => x.id === id);
  if (state.basket.length && !confirm('Remplacer la liste actuelle par « ' + p.name + ' » ?')) return;
  state.basket = p.items.map((it) => ({ id: uid(), key: it.key, label: it.label, qty: it.qty }));
  commit('Panier chargé');
}

function addPanierToBasket(id) {
  const p = state.paniers.find((x) => x.id === id);
  p.items.forEach((it) => {
    const ex = state.basket.find((x) => x.key === it.key);
    if (ex) ex.qty += it.qty;
    else state.basket.push({ id: uid(), key: it.key, label: it.label, qty: it.qty });
  });
  commit('Panier ajouté à la liste');
}

function delPanier(id) {
  if (!confirm('Supprimer ce panier habituel ?')) return;
  state.paniers = state.paniers.filter((x) => x.id !== id);
  commit();
}

</script>
