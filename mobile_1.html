<title>Budget prévisionnel</title>
<style>
/* =========================================================
   VARIABLES — mode clair puis mode sombre automatique
   ========================================================= */
:root {
  --bg: #f2f4f8;
  --card: #ffffff;
  --card2: #f7f8fb;
  --txt: #121826;
  --muted: #687082;
  --line: #e3e7ee;
  --accent: #2557e6;
  --accent-soft: #e5ecff;
  --pos: #12804a;
  --pos-soft: #e3f6ea;
  --neg: #c62828;
  --neg-soft: #fde8e8;
  --warn: #b45309;
  --warn-soft: #fff1dc;
  --sav: #8a4fd6;
  --sav-soft: #f1e8ff;
  --tabbar: rgba(255, 255, 255, 0.92);
  --shadow: 0 6px 18px rgba(18, 24, 38, 0.07);
  --radius: 16px;
  --tabbar-h: 58px;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0b0e14;
    --card: #161a23;
    --card2: #1d222d;
    --txt: #eef1f6;
    --muted: #9aa3b5;
    --line: #2a303d;
    --accent: #6b8cff;
    --accent-soft: #1f2a4d;
    --pos: #4cc983;
    --pos-soft: #12301f;
    --neg: #ff6b6b;
    --neg-soft: #3a1717;
    --warn: #f0a443;
    --warn-soft: #3a2a12;
    --sav: #b88cff;
    --sav-soft: #2c1f45;
    --tabbar: rgba(22, 26, 35, 0.92);
    --shadow: none;
  }
}

/* =========================================================
   BASE
   ========================================================= */
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
  font-size: 15px;
  line-height: 1.35;
  background: var(--bg);
  color: var(--txt);
  overflow-x: hidden;
  padding-bottom: calc(var(--tabbar-h) + var(--safe-bottom) + 96px);
}
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3 { margin: 0; letter-spacing: -0.01em; }
h2 { font-size: 17px; font-weight: 750; }
h3 { font-size: 14px; font-weight: 700; color: var(--muted); margin: 14px 0 6px; }
.muted { color: var(--muted); font-size: 13px; }
.num { font-variant-numeric: tabular-nums; }
.pos { color: var(--pos); }
.neg { color: var(--neg); }
.warn-txt { color: var(--warn); }
.hidden { display: none !important; }

/* =========================================================
   EN-TÊTE
   ========================================================= */
.appbar {
  position: sticky;
  top: 0;
  z-index: 20;
  padding: calc(var(--safe-top) + 8px) 16px 8px;
  background: var(--tabbar);
  backdrop-filter: saturate(180%) blur(18px);
  -webkit-backdrop-filter: saturate(180%) blur(18px);
  border-bottom: 1px solid var(--line);
  display: flex;
  align-items: center;
  gap: 10px;
  min-height: 48px;
}
.appbar h1 { font-size: 20px; font-weight: 800; flex: 1; }
.appbar .back {
  border: 0;
  background: none;
  color: var(--accent);
  font-weight: 650;
  padding: 8px 4px;
  min-height: 44px;
}

/* =========================================================
   MISE EN PAGE
   ========================================================= */
main { padding: 12px 12px 0; max-width: 520px; margin: 0 auto; }
.screen { display: none; }
.screen.active { display: block; }
.stack { display: grid; gap: 12px; }
.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 14px;
  min-width: 0;
}
.card.flat { box-shadow: none; background: var(--card2); }
.card-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 10px;
}
.row { display: flex; align-items: center; gap: 8px; min-width: 0; }
.row.wrap { flex-wrap: wrap; }
.row.between { justify-content: space-between; }
.grow { flex: 1; min-width: 0; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }

/* =========================================================
   CHIFFRES CLÉS
   ========================================================= */
.hero {
  background: linear-gradient(135deg, #1b2a5c, #2557e6);
  color: #fff;
  border: 0;
}
.hero .label { font-size: 13px; opacity: 0.8; }
.hero .big { font-size: 34px; font-weight: 800; letter-spacing: -0.02em; margin: 2px 0; }
.hero .sub { font-size: 13px; opacity: 0.85; }
.stat {
  background: var(--card2);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 8px 10px;
  min-width: 0;
}
.stat .k { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stat .v { font-size: 16px; font-weight: 750; font-variant-numeric: tabular-nums; white-space: nowrap; }

/* =========================================================
   CONTRÔLES
   ========================================================= */
label.field { display: block; font-size: 13px; font-weight: 650; color: var(--muted); margin: 10px 0 4px; }
input, select, textarea {
  width: 100%;
  font-size: 16px; /* évite le zoom automatique d'iOS */
  min-height: 44px;
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 10px 12px;
  background: var(--card);
  outline: none;
  -webkit-appearance: none;
  appearance: none;
}
select {
  background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
  background-position: calc(100% - 18px) 50%, calc(100% - 13px) 50%;
  background-size: 5px 5px;
  background-repeat: no-repeat;
  padding-right: 30px;
}
input:focus, select:focus, textarea:focus { border-color: var(--accent); }
input[type="checkbox"] { width: 22px; min-height: 22px; height: 22px; padding: 0; -webkit-appearance: checkbox; appearance: auto; }
input[type="range"] { padding: 0; border: 0; background: none; -webkit-appearance: auto; appearance: auto; }

.btn {
  border: 0;
  border-radius: 12px;
  min-height: 44px;
  padding: 10px 14px;
  font-weight: 700;
  background: var(--accent);
  color: #fff;
  white-space: nowrap;
}
.btn.block { width: 100%; }
.btn.ghost { background: var(--card2); color: var(--txt); border: 1px solid var(--line); }
.btn.danger { background: var(--neg); }
.btn.success { background: var(--pos); }
.btn.sm { min-height: 36px; padding: 6px 11px; font-size: 14px; border-radius: 10px; }
.btn:active { opacity: 0.75; }

.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip {
  border: 1px solid var(--line);
  background: var(--card);
  border-radius: 999px;
  min-height: 36px;
  padding: 6px 12px;
  font-size: 14px;
  font-weight: 600;
}
.chip.on { background: var(--accent); border-color: var(--accent); color: #fff; }

.seg {
  display: grid;
  grid-auto-flow: column;
  grid-auto-columns: 1fr;
  gap: 4px;
  background: var(--card2);
  border: 1px solid var(--line);
  padding: 3px;
  border-radius: 12px;
}
.seg button {
  border: 0;
  background: transparent;
  border-radius: 9px;
  min-height: 38px;
  font-weight: 650;
  font-size: 14px;
  color: var(--muted);
}
.seg button.on { background: var(--card); color: var(--accent); box-shadow: 0 1px 4px rgba(0, 0, 0, 0.1); }

.pill {
  display: inline-block;
  font-size: 12px;
  font-weight: 700;
  padding: 2px 8px;
  border-radius: 999px;
  background: var(--accent-soft);
  color: var(--accent);
  white-space: nowrap;
}
.pill.pos { background: var(--pos-soft); color: var(--pos); }
.pill.neg { background: var(--neg-soft); color: var(--neg); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.sav { background: var(--sav-soft); color: var(--sav); }
.pill.grey { background: var(--card2); color: var(--muted); border: 1px solid var(--line); }

/* =========================================================
   LISTES
   ========================================================= */
.list { display: grid; gap: 0; }
.li {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 11px 2px;
  border-bottom: 1px solid var(--line);
  min-height: 52px;
  min-width: 0;
}
.li:last-child { border-bottom: 0; }
.li.tap { cursor: pointer; }
.li.tap:active { background: var(--card2); }
.li .main { flex: 1; min-width: 0; }
.li .t { font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.li .s { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.li .amt { font-weight: 750; font-variant-numeric: tabular-nums; white-space: nowrap; text-align: right; }
.databar { height: 5px; border-radius: 3px; background: var(--card2); overflow: hidden; margin-top: 5px; }
.databar > i { display: block; height: 100%; border-radius: 3px; }
.empty {
  padding: 18px;
  text-align: center;
  color: var(--muted);
  border: 1px dashed var(--line);
  border-radius: 12px;
  font-size: 14px;
}

details.group { border-top: 1px solid var(--line); }
details.group:first-child { border-top: 0; }
details.group > summary {
  list-style: none;
  display: flex;
  align-items: center;
  gap: 8px;
  min-height: 48px;
  font-weight: 700;
  cursor: pointer;
}
details.group > summary::-webkit-details-marker { display: none; }
details.group > summary::before { content: "›"; font-size: 20px; color: var(--muted); transition: transform 0.15s; width: 12px; }
details.group[open] > summary::before { transform: rotate(90deg); }

/* Liste jour par jour */
.day { margin-bottom: 4px; }
.day-head {
  position: sticky;
  top: calc(var(--safe-top) + 48px);
  z-index: 5;
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  background: var(--bg);
  padding: 8px 4px 4px;
  font-size: 13px;
  font-weight: 700;
  color: var(--muted);
  text-transform: capitalize;
}
.day-head .bal { font-variant-numeric: tabular-nums; color: var(--txt); }
.day-head .bal.low { color: var(--warn); }
.day-head .bal.neg { color: var(--neg); }
.day-body { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 0 12px; }
.tag {
  display: inline-grid;
  place-items: center;
  width: 20px;
  height: 20px;
  border-radius: 6px;
  font-size: 11px;
  font-weight: 800;
  flex: none;
}
.tag.R { background: var(--accent-soft); color: var(--accent); }
.tag.P { background: var(--warn-soft); color: var(--warn); }
.tag.E { background: var(--sav-soft); color: var(--sav); }

/* Alertes */
.alert {
  border-radius: 12px;
  padding: 10px 12px;
  font-size: 14px;
  background: var(--warn-soft);
  color: var(--warn);
  border: 1px solid transparent;
}
.alert.bad { background: var(--neg-soft); color: var(--neg); }
.alert.ok { background: var(--pos-soft); color: var(--pos); }
.alert a { color: inherit; font-weight: 750; }

/* Graphes */
.chart svg { display: block; width: 100%; height: auto; }
.chart-cap { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
.progress { height: 8px; border-radius: 4px; background: var(--card2); overflow: hidden; margin: 8px 0; }
.progress > i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), var(--pos)); }
table.mini { width: 100%; border-collapse: collapse; font-size: 13px; }
table.mini td, table.mini th { padding: 6px 4px; border-bottom: 1px solid var(--line); text-align: left; }
table.mini th { color: var(--muted); font-weight: 650; font-size: 12px; }
table.mini .r { text-align: right; }

/* Menu de l'onglet Plus */
.menu .li { min-height: 58px; }
.menu .ico {
  width: 34px;
  height: 34px;
  border-radius: 9px;
  display: grid;
  place-items: center;
  font-size: 18px;
  background: var(--card2);
  flex: none;
}
.chev { color: var(--muted); font-size: 20px; }

/* =========================================================
   BARRE D'ONGLETS + BOUTON +
   ========================================================= */
.tabbar {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 30;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  height: calc(var(--tabbar-h) + var(--safe-bottom));
  padding-bottom: var(--safe-bottom);
  background: var(--tabbar);
  backdrop-filter: saturate(180%) blur(18px);

/* =========================================================
   PANNEAU DU BAS (bottom sheet)

.scrim {

.sheet-head {

.sheet-body {

.amount-input {

/* Notification brève */
.toast {

  left: 16px;

/* Impression du récapitulatif */

body.printing #printArea {

<script>
/* =========================================================
   DONNÉES — utilitaires, stockage, migration
   ========================================================= */
'use strict';

const STORAGE_KEY = 'budgetMobileSolo_v1';
const DATA_VERSION = 2;
const DAY_MS = 86400000;
const DEFAULT_INCOME_CATS = ['Salaire', 'Loyers', 'Allocations', 'Autres'];

/* ---------- Dates (toujours en heure locale) ---------- */

function pad2(n) {
  return String(n).padStart(2, '0');
}

/** Date locale -> 'AAAA-MM-JJ' (l'ancien code utilisait l'UTC, faux après minuit). */
function iso(d) {
  return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
}

function todayISO() {
  return iso(new Date());
}

/** 'AAAA-MM-JJ' -> Date locale à minuit. */
function dateObj(s) {
  if (!s) return startOfDay(new Date());
  const p = String(s).split('-').map(Number);
  const d = new Date(p[0], (p[1] || 1) - 1, p[2] || 1);
  return isNaN(d) ? startOfDay(new Date()) : d;
}

function startOfDay(d) {
  return new Date(d.getFullYear(), d.getMonth(), d.getDate());
}

function addDays(d, n) {
  const x = new Date(d);
  x.setDate(x.getDate() + n);
  return x;
}

function addMonthsDate(d, m) {
  const x = new Date(d);
  const day = x.getDate();
  x.setDate(1);
  x.setMonth(x.getMonth() + m);
  x.setDate(Math.min(day, daysInMonth(x.getFullYear(), x.getMonth())));
  return x;
}

function daysBetween(aISO, bISO) {
  return Math.round((dateObj(bISO) - dateObj(aISO)) / DAY_MS);
}

function daysInMonth(year, monthIndex) {
  return new Date(year, monthIndex + 1, 0).getDate();
}

function monthDiff(a, b) {
  return (b.getFullYear() - a.getFullYear()) * 12 + (b.getMonth() - a.getMonth());
}

/** 'AAAA-MM' + n mois. */
function addMonthsYm(ym, n) {
  const p = String(ym).split('-').map(Number);
  const d = new Date(p[0], p[1] - 1 + n, 1);
  return d.getFullYear() + '-' + pad2(d.getMonth() + 1);
}

function ymList(fromYm, toYm) {
  const out = [];
  let ym = fromYm;
  for (let guard = 0; ym <= toYm && guard < 240; guard++) {
    out.push(ym);
    ym = addMonthsYm(ym, 1);
  }
  return out;
}

/** Date d'un jour donné dans un mois, bornée au dernier jour du mois (31 -> 30, 28 ou 29). */
function dayInMonthISO(ym, day) {
  const p = ym.split('-').map(Number);
  const last = daysInMonth(p[0], p[1] - 1);
  return ym + '-' + pad2(Math.min(Math.max(Number(day) || 1, 1), last));
}

function endOfMonthISO(ym) {
  const p = ym.split('-').map(Number);
  return iso(new Date(p[0], p[1], 0));
}

function genMonths(startYm, count, amount) {
  const out = [];
  for (let i = 0; i < count; i++) out.push({ ym: addMonthsYm(startYm, i), amount: Number(amount) || 0 });
  return out;
}

/* ---------- Formats ---------- */

const EURO_FMT = new Intl.NumberFormat('fr-FR', { style: 'currency', currency: 'EUR' });
const EURO0_FMT = new Intl.NumberFormat('fr-FR', { style: 'currency', currency: 'EUR', maximumFractionDigits: 0 });

function euro(n) {
  return EURO_FMT.format(Number(n) || 0);
}

function euro0(n) {
  return EURO0_FMT.format(Math.round(Number(n) || 0));
}

function parseAmount(x) {
  if (typeof x === 'number') return isFinite(x) ? x : 0;
  const s = String(x || '0').replace(/[\s €]/g, '').replace(',', '.');
  return Number(s) || 0;
}

function fmtDay(isoStr) {
  return dateObj(isoStr).toLocaleDateString('fr-FR', { weekday: 'short', day: 'numeric', month: 'short' });
}

function fmtDate(isoStr) {
  if (!isoStr) return '—';
  return dateObj(isoStr).toLocaleDateString('fr-FR', { day: 'numeric', month: 'short', year: 'numeric' });
}

function fmtShort(isoStr) {
  return dateObj(isoStr).toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' });
}

function ymShort(ym) {
  const p = String(ym).split('-');
  return p[1] + '/' + p[0].slice(2);
}

function monthNameFR(ym) {
  const p = ym.split('-').map(Number);
  return new Date(p[0], p[1] - 1, 1).toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' });
}

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, (m) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
  }[m]));
}

function uid() {
  return Math.random().toString(36).slice(2, 10);
}

function sum(arr, f) {
  return arr.reduce((s, x) => s + (f ? f(x) : x), 0);
}

/* ---------- État ---------- */

function defaultState() {
  return {
    settings: {
      version: DATA_VERSION,
      startBalance: 0,
      startDate: todayISO(),
      targetDate: '',
      alertThreshold: 300,
      savingMode: 'parallel',
      savingEnvelope: 0,
      incomeCats: DEFAULT_INCOME_CATS.slice(),
      grocery: { active: false, amount: 0, weekday: 6, label: 'Plein de courses', start: '' },
      daySurplus: 0,
      lastBackup: '',
    },
    recurring: [],
    oneoffs: [],
    savings: [],
    courses: [],
    basket: [],
    paniers: [],
  };
}

let state = defaultState();

/**
 * Remet l'état en conformité avec le modèle courant.
 * Idempotente : peut être appelée autant de fois que voulu (chargement, import).
 */
function normalizeState() {
  const d = defaultState();
  if (!state || typeof state !== 'object') state = d;
  state.settings = Object.assign({}, d.settings, state.settings || {});
  const st = state.settings;

  ['recurring', 'oneoffs', 'savings', 'courses', 'basket', 'paniers'].forEach((k) => {
    if (!Array.isArray(state[k])) state[k] = [];
  });

  // Réglages numériques
  st.startBalance = parseAmount(st.startBalance);
  st.alertThreshold = parseAmount(st.alertThreshold);
  st.savingEnvelope = parseAmount(st.savingEnvelope);
  st.daySurplus = Math.max(0, Number(st.daySurplus) || 0);
  if (!/^\d{4}-\d{2}-\d{2}$/.test(st.startDate || '')) st.startDate = todayISO();

  // Ancien « horizon » (en jours) -> date cible unique
  if (!/^\d{4}-\d{2}-\d{2}$/.test(st.targetDate || '')) {
    const h = Number(st.horizon) || 90;
    st.targetDate = iso(addDays(dateObj(todayISO()), h));
  }

  // Reliquats obsolètes
  delete st.scenario;
  delete st.horizon;

  if (!st.grocery || typeof st.grocery !== 'object') st.grocery = Object.assign({}, d.settings.grocery);

  // Familles d'entrées
  if (!Array.isArray(st.incomeCats) || !st.incomeCats.length) st.incomeCats = DEFAULT_INCOME_CATS.slice();

  // Opérations récurrentes
  state.recurring.forEach((r) => {
    if (!r.id) r.id = uid();
    if (r.type === 'income') {
      if (!r.category) r.category = 'Autres';
      if (!Array.isArray(r.schedule)) r.schedule = [];
      if (!r.schedule.length && parseAmount(r.amount) > 0) {
        r.schedule = genMonths(todayISO().slice(0, 7), 18, parseAmount(r.amount));
      }
      r.schedule = r.schedule
        .filter((l) => l && /^\d{4}-\d{2}$/.test(l.ym || ''))
        .map((l) => ({ ym: l.ym, amount: parseAmount(l.amount) }));
      if (!r.day) r.day = 27;
      // Champs hérités de l'ancien système de scénarios
      delete r.amount;
      delete r.confidence;
      delete r.variable;
      delete r.active;
      if (!st.incomeCats.includes(r.category)) st.incomeCats.push(r.category);
    } else {
      r.type = 'expense';
      r.amount = parseAmount(r.amount);
      r.day = Math.min(31, Math.max(1, Number(r.day) || 1));
      if (!r.category) r.category = 'Divers';
      if (r.end == null) r.end = '';
    }
  });

  state.oneoffs.forEach((o) => {
    if (!o.id) o.id = uid();
    o.amount = Math.abs(parseAmount(o.amount));
    if (!['expense', 'income', 'saving'].includes(o.type)) o.type = 'expense';
    if (!o.date) o.date = todayISO();
    if (!o.category) o.category = 'Divers';
  });

  state.savings.forEach((g) => {
    if (!g.id) g.id = uid();
    if (!Array.isArray(g.ops)) g.ops = [];
    if (g.opening === undefined) g.opening = parseAmount(g.current);
    if (!g.kind) g.kind = 'objectif';
  });

  st.version = DATA_VERSION;
}

function load() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) state = JSON.parse(raw);
  } catch (e) {
    state = defaultState();
  }
  normalizeState();
}

function save() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch (e) {
    toast('Enregistrement impossible sur cet appareil');
  }
}

/* ---------- Notification brève ---------- */

let toastTimer = null;

function toast(msg) {
  const t = document.getElementById('toast');
  if (!t) return;
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2300);
}

/* =========================================================
   CALCULS — opérations, projection, budget journalier, épargne
   Chaque opération générée porte :
     { date, type: 'income'|'expense'|'saving', label, category, amount,
       kind: 'R' (récurrente) | 'P' (ponctuelle) | 'E' (épargne),
       src: 'rec'|'inc'|'one'|'sav'|'groc', ref: id d'origine }
   ========================================================= */

/* ---------- Accès ---------- */

function incomes() {
  return state.recurring.filter((r) => r.type === 'income');
}

function expensesRec() {
  return state.recurring.filter((r) => r.type === 'expense');
}

function incLineAt(r, ym) {
  const l = (r.schedule || []).find((x) => x.ym === ym);
  return l ? Number(l.amount) || 0 : 0;
}

function incMonthTotal(ym) {
  return sum(incomes(), (r) => incLineAt(r, ym));
}

function incCats() {
  const st = state.settings;
  if (!Array.isArray(st.incomeCats) || !st.incomeCats.length) st.incomeCats = DEFAULT_INCOME_CATS.slice();
  return st.incomeCats;
}

/** Équivalent mensuel des sorties récurrentes (hors courses hebdo). */
function monthlyCharges() {
  return sum(expensesRec(), (r) => Number(r.amount) || 0);
}

/* ---------- Génération des opérations sur une période ---------- */

function recurringEvents(fromISO, toISO) {
  const out = [];
  const months = ymList(fromISO.slice(0, 7), toISO.slice(0, 7));

  state.recurring.forEach((r) => {
    if (r.type === 'income') {
      (r.schedule || []).forEach((l) => {
        const amt = Number(l.amount) || 0;
        if (amt <= 0 || !l.ym) return;
        const d = dayInMonthISO(l.ym, r.day);
        if (d >= fromISO && d <= toISO) {
          out.push({ date: d, type: 'income', label: r.label, category: r.category, amount: amt, kind: 'R', src: 'inc', ref: r.id });
        }
      });
      return;
    }
    const amt = Number(r.amount) || 0;
    if (amt <= 0) return;
    months.forEach((ym) => {
      const d = dayInMonthISO(ym, r.day);
      if (d < fromISO || d > toISO) return;
      if (r.start && d < r.start) return;
      if (r.end && d > r.end) return;
      out.push({ date: d, type: 'expense', label: r.label, category: r.category, amount: amt, kind: 'R', src: 'rec', ref: r.id });
    });
  });
  return out;
}

function groceryEvents(fromISO, toISO) {
  const g = state.settings.grocery;
  if (!g || !g.active || !(Number(g.amount) > 0)) return [];
  const startISO = g.start && g.start > fromISO ? g.start : fromISO;
  let d = dateObj(startISO);
  for (let i = 0; i < 7 && d.getDay() !== Number(g.weekday); i++) d = addDays(d, 1);
  const out = [];
  for (let guard = 0; iso(d) <= toISO && guard < 600; guard++) {
    out.push({
      date: iso(d), type: 'expense', label: g.label || 'Plein de courses', category: 'Courses',
      amount: Number(g.amount), kind: 'R', src: 'groc', ref: 'grocery',
    });
    d = addDays(d, 7);
  }
  return out;
}

function savingEvents(fromISO, toISO) {
  const goals = state.savings.filter((g) => g.active !== false && gRemaining(g) > 0);
  const mode = state.settings.savingMode || 'parallel';
  const envelope = parseAmount(state.settings.savingEnvelope);
  const minP = goals.length ? Math.min(...goals.map((x) => x.priority || 1)) : 1;
  const sumW = sum(goals, (x) => 1 / Math.max(1, x.priority || 1));
  const out = [];

  goals.forEach((g) => {
    let monthly = gPlanned(g);
    if (mode === 'envelope' && envelope) monthly = envelope * ((1 / Math.max(1, g.priority || 1)) / sumW);
    if (mode === 'priority' && (g.priority || 1) > minP) monthly = 0;
    if (monthly <= 0) return;

    const firstISO = g.start && g.start > fromISO ? g.start : fromISO;
    let ym = firstISO.slice(0, 7);
    if (dayInMonthISO(ym, 15) < firstISO) ym = addMonthsYm(ym, 1);
    for (let guard = 0; guard < 240; guard++) {
      const d = dayInMonthISO(ym, 15);
      if (d > toISO) break;
      out.push({
        date: d, type: 'saving', label: 'Épargne – ' + g.label, category: 'Épargne',
        amount: monthly, kind: 'E', src: 'sav', ref: g.id,
      });
      ym = addMonthsYm(ym, 1);
    }
  });
  return out;
}

function oneoffEvents(fromISO, toISO) {
  return state.oneoffs
    .filter((o) => o.date >= fromISO && o.date <= toISO)
    .map((o) => ({
      date: o.date, type: o.type, label: o.label, category: o.category,
      amount: Number(o.amount) || 0, kind: 'P', src: 'one', ref: o.id,
    }));
}

const TYPE_ORDER = { income: 0, expense: 1, saving: 2 };

function allEvents(fromISO, toISO) {
  return [
    ...recurringEvents(fromISO, toISO),
    ...groceryEvents(fromISO, toISO),
    ...savingEvents(fromISO, toISO),
    ...oneoffEvents(fromISO, toISO),
  ].sort((a, b) => a.date.localeCompare(b.date) || TYPE_ORDER[a.type] - TYPE_ORDER[b.type]);
}

/* ---------- Projection ---------- */

/** Date cible globale (une seule pour toute l'application). */
function targetDate() {
  const st = state.settings;
  const today = todayISO();
  const floor = st.startDate > today ? st.startDate : today;
  let td = st.targetDate;
  if (!td || td <= floor) td = iso(addDays(dateObj(floor), 30));
  return td;
}

/**
 * Projection du solde du point de départ jusqu'à toISO.
 * Une « sortie » = dépense (récurrente, courses, ponctuelle) + versement d'épargne.
 */
function projection(toISO) {
  const st = state.settings;
  const fromISO = st.startDate;
  const end = toISO || targetDate();
  let bal = parseAmount(st.startBalance);
  let low = bal;
  let lowDate = fromISO;
  let inSum = 0;
  let expSum = 0;
  let savSum = 0;

  const rows = allEvents(fromISO, end).map((e) => {
    if (e.type === 'income') {
      bal += e.amount;
      inSum += e.amount;
    } else {
      bal -= e.amount;
      if (e.type === 'saving') savSum += e.amount;
      else expSum += e.amount;
    }
    if (bal < low) {
      low = bal;
      lowDate = e.date;
    }
    return Object.assign({}, e, { balance: bal });
  });

  // Point d'ancrage : aujourd'hui (ou le départ s'il est dans le futur).
  // Tous les indicateurs de prévision portent sur la période ancrage -> date cible.
  const today = todayISO();
  const anchor = today > fromISO ? today : fromISO;
  const past = rows.filter((r) => r.date < anchor);
  const future = rows.filter((r) => r.date >= anchor);
  const anchorBal = past.length ? past[past.length - 1].balance : parseAmount(st.startBalance);
  let fLow = anchorBal;
  let fLowDate = anchor;
  future.forEach((r) => {
    if (r.balance < fLow) {
      fLow = r.balance;
      fLowDate = r.date;
    }
  });
  const fSum = (pred) => sum(future.filter(pred), (r) => r.amount);

  return {
    from: fromISO, to: end, start: parseAmount(st.startBalance), rows,
    end: bal, low, lowDate, inSum, expSum, savSum, outSum: expSum + savSum,
    anchor, anchorBal, future,
    fLow, fLowDate,
    fIn: fSum((r) => r.type === 'income'),
    fExp: fSum((r) => r.type === 'expense'),
    fSav: fSum((r) => r.type === 'saving'),
  };
}

/** Regroupe les lignes de projection par jour avec le solde de fin de journée. */
function groupByDay(rows) {
  const days = [];
  rows.forEach((r) => {
    let d = days[days.length - 1];
    if (!d || d.date !== r.date) {
      d = { date: r.date, rows: [], balance: r.balance };
      days.push(d);
    }
    d.rows.push(r);
    d.balance = r.balance;
  });
  return days;
}

/* ---------- Budget journalier ---------- */

/** Points (jours depuis l'ancrage, solde) de la trajectoire engagée à venir. */
function balancePoints(p) {
  const pts = [{ t: 0, y: p.anchorBal }];
  p.future.forEach((r) => pts.push({ t: daysBetween(p.anchor, r.date), y: r.balance }));
  pts.push({ t: horizonDays(p), y: p.end });
  return pts;
}

function horizonDays(p) {
  return Math.max(1, daysBetween(p.anchor, p.to));
}

/** Imprévu quotidien maximal qui garde le solde au-dessus du seuil sur toute la période. */
function safeDaily(p) {
  const alert = parseAmount(state.settings.alertThreshold);
  let best = Infinity;
  balancePoints(p).forEach((pt) => {
    if (pt.t > 0) best = Math.min(best, (pt.y - alert) / pt.t);
  });
  return Math.max(0, isFinite(best) ? best : 0);
}

function dailyStats(p) {
  const N = horizonDays(p);
  const f = p.future;
  const recOut = sum(f.filter((r) => r.src === 'rec'), (r) => r.amount);
  const grocOut = sum(f.filter((r) => r.src === 'groc'), (r) => r.amount);
  const oneOut = sum(f.filter((r) => r.type === 'expense' && r.src === 'one'), (r) => r.amount);
  const savOut = p.fSav;

  // Imprévus réels : ponctuelles saisies depuis le départ, ramenées au jour.
  const today = todayISO();
  const elapsed = daysBetween(p.from, today);
  const pastOneoffs = sum(
    state.oneoffs.filter((o) => o.type === 'expense' && o.date >= p.from && o.date <= today),
    (o) => o.amount,
  );

  return {
    N,
    floor: (recOut + grocOut + oneOut + savOut) / N,
    floorParts: { rec: recOut / N, groc: grocOut / N, one: oneOut / N, sav: savOut / N },
    avgFuture: (p.fExp + p.fSav) / N,
    real: elapsed >= 1 ? pastOneoffs / elapsed : null,
    safe: safeDaily(p),
  };
}

/** Trajectoire simulée avec un imprévu quotidien constant. */
function simulate(p, surplus) {
  const alert = parseAmount(state.settings.alertThreshold);
  const pts = balancePoints(p).map((pt) => ({ t: pt.t, y: pt.y - surplus * pt.t }));
  let low = Infinity;
  let firstAlert = null;
  let firstZero = null;
  pts.forEach((pt) => {
    low = Math.min(low, pt.y);
    if (firstAlert === null && pt.y < alert) firstAlert = pt.t;
    if (firstZero === null && pt.y < 0) firstZero = pt.t;
  });
  const N = horizonDays(p);
  return { pts, low, end: p.end - surplus * N, impact: surplus * N, firstAlert, firstZero };
}

/* ---------- Agrégats mensuels (graphes) ---------- */

/** Mois couverts par la période courante : du mois en cours au mois cible (3 à 24 mois). */
function chartMonths() {
  const from = todayISO().slice(0, 7);
  let to = targetDate().slice(0, 7);
  if (to < addMonthsYm(from, 2)) to = addMonthsYm(from, 2);
  if (to > addMonthsYm(from, 23)) to = addMonthsYm(from, 23);
  return ymList(from, to);
}

function monthlyTotals(events, months) {
  const m = {};
  events.forEach((e) => {
    const k = e.date.slice(0, 7);
    m[k] = (m[k] || 0) + e.amount;
  });
  return months.map((ym) => ({ ym, label: ymShort(ym), value: m[ym] || 0 }));
}

function expenseMonthly() {
  const months = chartMonths();
  const from = months[0] + '-01';
  const to = endOfMonthISO(months[months.length - 1]);
  const ev = [...recurringEvents(from, to), ...groceryEvents(from, to)].filter((e) => e.type === 'expense');
  return monthlyTotals(ev, months);
}

function incomeMonthly() {
  return chartMonths().map((ym) => ({ ym, label: ymShort(ym), value: incMonthTotal(ym) }));
}

function savingMonthly() {
  const months = chartMonths();
  return monthlyTotals(savingEvents(months[0] + '-01', endOfMonthISO(months[months.length - 1])), months);
}

/* ---------- Enveloppes d'épargne ---------- */

function gTarget(g) {
  if (g.kind === 'precaution') return (Number(g.monthsCover) || 0) * monthlyCharges();
  return Number(g.target) || 0;
}

function gDue(g) {
  if (!g.due) return '';
  if (g.kind === 'charge' && g.recurrence === 'annual') {
    let d = dateObj(g.due);
    const now = dateObj(todayISO());
    for (let guard = 0; d < now && guard < 60; guard++) d = addMonthsDate(d, 12);
    return iso(d);
  }
  return g.due;
}

function gBalance(g) {
  return (Number(g.opening) || 0) + sum(g.ops || [], (o) => Number(o.amount) || 0);
}

function gRemaining(g) {
  if (g.kind === 'tampon') return 0;
  return Math.max(0, gTarget(g) - gBalance(g));
}

function gPct(g) {
  const t = gTarget(g);
  return t > 0 ? Math.min(100, Math.round((gBalance(g) / t) * 100)) : 0;
}

function gMonthsLeft(g) {
  const due = gDue(g);
  if (!due) return null;
  return Math.max(1, monthDiff(new Date(), dateObj(due)) + 1);
}

function gRequired(g) {
  const ml = gMonthsLeft(g);
  if (ml == null) return Number(g.monthly) || 0;
  return Math.max(0, gRemaining(g) / ml);
}

function gPlanned(g) {
  if (g.kind === 'tampon') return Number(g.monthly) || 0;
  return Number(g.monthly) > 0 ? Number(g.monthly) : gRequired(g);
}

function gFinishDate(g) {
  const pm = gPlanned(g);
  if (pm <= 0 || gRemaining(g) <= 0) return null;
  return addMonthsDate(new Date(), Math.ceil(gRemaining(g) / pm));
}

function gIdeal(g) {
  const due = gDue(g);
  if (!g.start || !due) return null;
  const s = dateObj(g.start);
  const d = dateObj(due);
  const span = d - s;
  if (span <= 0) return null;
  const f = Math.min(1, Math.max(0, (new Date() - s) / span));
  return gTarget(g) * f;
}

function gStatus(g) {
  if (g.kind === 'tampon') {
    const lt = Number(g.lowThreshold) || 0;
    return lt && gBalance(g) < lt ? { label: 'Sous le seuil', cls: 'warn' } : { label: 'Disponible', cls: 'pos' };
  }
  if (gRemaining(g) <= 0) return { label: 'Atteint', cls: 'pos' };
  const i = gIdeal(g);
  if (i != null) return gBalance(g) >= i ? { label: 'En avance', cls: 'pos' } : { label: 'En retard', cls: 'warn' };
  return { label: 'En cours', cls: '' };
}

/* ---------- Récapitulatif mensuel ---------- */

function monthlyRecap(fromYm, toYm) {
  const p = projection(endOfMonthISO(toYm));
  const byCat = (arr) => {
    const m = {};
    arr.forEach((e) => { m[e.category || 'Divers'] = (m[e.category || 'Divers'] || 0) + e.amount; });
    return Object.entries(m).sort((a, b) => b[1] - a[1]);
  };
  return ymList(fromYm, toYm).map((ym) => {
    const mStart = ym + '-01';
    const mEnd = endOfMonthISO(ym);
    const before = p.rows.filter((r) => r.date < mStart);
    const opening = before.length ? before[before.length - 1].balance : p.start;
    const evs = p.rows.filter((r) => r.date >= mStart && r.date <= mEnd);
    const closing = evs.length ? evs[evs.length - 1].balance : opening;
    const low = Math.min(opening, ...evs.map((r) => r.balance));
    const inc = evs.filter((e) => e.type === 'income');
    const sav = evs.filter((e) => e.type === 'saving');
    const groc = evs.filter((e) => e.src === 'groc');
    const exp = evs.filter((e) => e.type === 'expense' && e.src !== 'groc');
    return {
      ym, opening, closing, low,
      incTotal: sum(inc, (e) => e.amount), expTotal: sum(exp, (e) => e.amount),
      grocTotal: sum(groc, (e) => e.amount), savTotal: sum(sav, (e) => e.amount),
      incBy: byCat(inc), expBy: byCat(exp), savBy: byCat(sav), grocCount: groc.length,
    };
  });
}

/* =========================================================
   RENDU — graphes SVG (largeur fluide, couleurs du thème)
   ========================================================= */

const CHART_W = 400;

/** Barre de données (part d'une ligne dans son groupe). */
function dataBar(frac, color) {
  const w = Math.max(0, Math.min(100, (frac || 0) * 100));
  return '<div class="databar"><i style="width:' + w.toFixed(0) + '%;background:' + color + '"></i></div>';
}

/** Histogramme mensuel. rows = [{label, value}] */
function barSVG(rows, opts) {
  opts = opts || {};
  const H = opts.height || 170;
  const padL = 6;
  const padR = 6;
  const padT = 18;
  const padB = 22;
  const n = Math.max(1, rows.length);
  const step = (CHART_W - padL - padR) / n;
  const bw = Math.min(28, step * 0.68);
  if (!rows.some((r) => r.value > 0)) return '<div class="empty">' + (opts.empty || 'Rien à afficher sur la période.') + '</div>';
  const max = Math.max(1, ...rows.map((r) => r.value));
  const color = opts.color || 'var(--accent)';
  const labelEvery = n > 12 ? 2 : 1;
  let s = '';

  rows.forEach((r, i) => {
    const cx = padL + (i + 0.5) * step;
    const bh = (r.value / max) * (H - padT - padB);
    const y = H - padB - bh;
    s += '<rect x="' + (cx - bw / 2).toFixed(1) + '" y="' + y.toFixed(1) + '" width="' + bw.toFixed(1)
      + '" height="' + Math.max(0, bh).toFixed(1) + '" rx="3" style="fill:' + color + '"><title>'
      + esc(r.label) + ' : ' + euro(r.value) + '</title></rect>';
    if (i % labelEvery === 0) {
      s += '<text x="' + cx.toFixed(1) + '" y="' + (H - 6) + '" text-anchor="middle" style="font-size:11px;fill:var(--muted)">'
        + esc(r.label) + '</text>';
    }
    if (r.value > 0 && n <= 12) {
      s += '<text x="' + cx.toFixed(1) + '" y="' + (y - 4).toFixed(1) + '" text-anchor="middle" style="font-size:11px;fill:var(--txt)">'
        + Math.round(r.value) + '</text>';
    }
  });

  return '<svg viewBox="0 0 ' + CHART_W + ' ' + H + '" role="img">' + s + '</svg>';
}

/**
 * Courbe de solde.
 * pts = [{t: millisecondes, y: solde}] ; opts.extra = trajectoire simulée ;
 * opts.threshold = seuil d'alerte (ligne orange).
 */
function lineSVG(pts, opts) {
  opts = opts || {};
  if (!pts || pts.length < 2) return '<div class="empty">Pas assez de données pour tracer la courbe.</div>';
  const H = opts.height || 190;
  const padL = 8;
  const padR = 8;
  const padT = 22;
  const padB = 24;
  const extra = opts.extra && opts.extra.length > 1 ? opts.extra : null;
  const all = pts.concat(extra || []);
  const t0 = Math.min(...all.map((p) => p.t));
  const t1 = Math.max(...all.map((p) => p.t));
  const thr = opts.threshold;
  const ys = all.map((p) => p.y).concat(thr != null ? [thr] : []);
  const ymin = Math.min(0, ...ys);
  const ymax = Math.max(...ys);
  const span = Math.max(1, t1 - t0);
  const yr = Math.max(1, ymax - ymin);
  const X = (t) => padL + ((t - t0) / span) * (CHART_W - padL - padR);
  const Y = (v) => H - padB - ((v - ymin) / yr) * (H - padT - padB);
  // Tracé « en escalier » : le solde reste constant entre deux opérations.
  const path = (a) => a.map((p, i) => {
    if (i === 0) return 'M' + X(p.t).toFixed(1) + ' ' + Y(p.y).toFixed(1);
    return 'H' + X(p.t).toFixed(1) + ' V' + Y(p.y).toFixed(1);
  }).join(' ');
  const fmt = (ms) => new Date(ms).toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' });

  const line = path(pts);
  const area = line + ' V' + Y(ymin).toFixed(1) + ' H' + X(pts[0].t).toFixed(1) + ' Z';
  const last = pts[pts.length - 1];
  const lowP = pts.reduce((m, p) => (p.y < m.y ? p : m), pts[0]);
  let s = '';

  s += '<path d="' + area + '" style="fill:var(--accent);opacity:.10"/>';
  if (ymin < 0) {
    s += '<line x1="' + padL + '" x2="' + (CHART_W - padR) + '" y1="' + Y(0).toFixed(1) + '" y2="' + Y(0).toFixed(1)
      + '" style="stroke:var(--muted);stroke-dasharray:3 3"/>';
  }
  if (thr != null && thr > 0) {
    s += '<line x1="' + padL + '" x2="' + (CHART_W - padR) + '" y1="' + Y(thr).toFixed(1) + '" y2="' + Y(thr).toFixed(1)
      + '" style="stroke:var(--warn);stroke-dasharray:6 4;stroke-width:1.5"/>';
    s += '<text x="' + (padL + 2) + '" y="' + (Y(thr) - 4).toFixed(1) + '" style="font-size:11px;fill:var(--warn)">seuil '
      + euro0(thr) + '</text>';
  }
  s += '<path d="' + line + '" style="fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round"/>';
  if (extra) {
    s += '<path d="' + path(extra) + '" style="fill:none;stroke:var(--neg);stroke-width:2;stroke-dasharray:6 4"/>';
    const le = extra[extra.length - 1];
    s += '<circle cx="' + X(le.t).toFixed(1) + '" cy="' + Y(le.y).toFixed(1) + '" r="3.5" style="fill:var(--neg)"/>';
  }
  s += '<circle cx="' + X(lowP.t).toFixed(1) + '" cy="' + Y(lowP.y).toFixed(1) + '" r="4" style="fill:var(--neg)"/>';
  s += '<circle cx="' + X(last.t).toFixed(1) + '" cy="' + Y(last.y).toFixed(1) + '" r="4" style="fill:var(--accent)"/>';
  s += '<text x="' + (CHART_W - padR) + '" y="14" text-anchor="end" style="font-size:12px;font-weight:700;fill:var(--accent)">'
    + euro0(last.y) + '</text>';
  s += '<text x="' + padL + '" y="' + (H - 6) + '" style="font-size:11px;fill:var(--muted)">' + fmt(t0) + '</text>';
  s += '<text x="' + (CHART_W - padR) + '" y="' + (H - 6) + '" text-anchor="end" style="font-size:11px;fill:var(--muted)">'
    + fmt(t1) + '</text>';

  return '<svg viewBox="0 0 ' + CHART_W + ' ' + H + '" role="img">' + s + '</svg>';
}

/** Courbe d'une projection (+ trajectoire simulée facultative). */
function projectionChart(p, sim) {
  const startMs = dateObj(p.anchor).getTime();
  const toMs = (t) => startMs + t * DAY_MS;
  const pts = balancePoints(p).map((pt) => ({ t: toMs(pt.t), y: pt.y }));
  const extra = sim ? sim.pts.map((pt) => ({ t: toMs(pt.t), y: pt.y })) : null;
  return lineSVG(pts, { extra, threshold: parseAmount(state.settings.alertThreshold) });
}

/** Mini-graphe de trajectoire d'une enveloppe d'épargne. */
function goalChartSVG(g) {
  const t = gTarget(g);
  if (t <= 0 || !g.start) return '';
  const start = dateObj(g.start);
  const dueISO = gDue(g);
  const due = dueISO ? dateObj(dueISO) : addMonthsDate(new Date(), 12);
  const now = new Date();
  const t0 = start.getTime();
  const t1 = Math.max(due.getTime(), now.getTime() + 5 * DAY_MS);
  const span = Math.max(1, t1 - t0);
  const W = CHART_W;
  const H = 100;
  const P = 8;
  const X = (ms) => P + ((Math.min(Math.max(ms, t0), t1) - t0) / span) * (W - 2 * P);
  const maxY = Math.max(t, gBalance(g)) * 1.08 || 1;
  const Y = (v) => H - P - (Math.max(0, Math.min(v, maxY)) / maxY) * (H - 2 * P);

  const pts = [{ ms: t0, v: Number(g.opening) || 0 }];
  (g.ops || []).slice().sort((a, b) => a.date.localeCompare(b.date)).forEach((o) => {
    pts.push({ ms: dateObj(o.date).getTime(), v: pts[pts.length - 1].v + (Number(o.amount) || 0) });
  });
  pts.push({ ms: now.getTime(), v: gBalance(g) });
  const real = pts.map((p) => X(p.ms).toFixed(1) + ',' + Y(p.v).toFixed(1)).join(' ');
  const finish = gFinishDate(g);
  let proj = '';
  if (finish && gRemaining(g) > 0) {
    proj = '<line x1="' + X(now.getTime()).toFixed(1) + '" y1="' + Y(gBalance(g)).toFixed(1) + '" x2="'
      + X(finish.getTime()).toFixed(1) + '" y2="' + Y(t).toFixed(1) + '" style="stroke:var(--pos);stroke-width:2;stroke-dasharray:4 3"/>';
  }
  return '<div class="chart" style="margin-top:8px"><svg viewBox="0 0 ' + W + ' ' + H + '">'
    + '<line x1="' + P + '" x2="' + (W - P) + '" y1="' + Y(t).toFixed(1) + '" y2="' + Y(t).toFixed(1) + '" style="stroke:var(--line);stroke-dasharray:3 3"/>'
    + '<line x1="' + X(t0).toFixed(1) + '" y1="' + Y(0).toFixed(1) + '" x2="' + X(due.getTime()).toFixed(1) + '" y2="' + Y(t).toFixed(1) + '" style="stroke:var(--muted);stroke-width:1.5"/>'
    + proj
    + '<polyline points="' + real + '" style="fill:none;stroke:var(--accent);stroke-width:2.5"/>'
    + '<circle cx="' + X(now.getTime()).toFixed(1) + '" cy="' + Y(gBalance(g)).toFixed(1) + '" r="4" style="fill:var(--accent)"/>'
    + '</svg><div class="muted" style="font-size:12px">— idéal · <span style="color:var(--accent)">— réel</span> · <span style="color:var(--pos)">- - projeté</span></div></div>';
}

/* =========================================================
   INTERACTIONS — navigation, panneau du bas, composants partagés
   ========================================================= */

const ui = {
  tab: 'today',
  moreView: null, // sous-page de l'onglet Plus
  opsView: 'expense',
  sheetOnClose: null,
};

const TAB_TITLES = { today: 'Aujourd’hui', calendar: 'Calendrier', ops: 'Opérations', more: 'Plus' };

function $(id) {
  return document.getElementById(id);
}

/* ---------- Navigation ---------- */

function showTab(tab) {
  ui.tab = tab;
  if (tab !== 'more') ui.moreView = null;
  document.querySelectorAll('.screen').forEach((s) => s.classList.toggle('active', s.id === 'scr-' + tab));
  document.querySelectorAll('#tabbar button').forEach((b) => b.classList.toggle('on', b.dataset.tab === tab));
  window.scrollTo(0, 0);
  render();
}

function updateAppbar() {
  const sub = ui.tab === 'more' && ui.moreView ? MORE_PAGES[ui.moreView] : null;
  $('appTitle').textContent = sub ? sub.title : TAB_TITLES[ui.tab];
  $('backBtn').classList.toggle('hidden', !sub);
}

/** Rendu de l'onglet visible uniquement (pas de recalcul inutile des autres). */
function render() {
  updateAppbar();
  if (ui.tab === 'today') renderToday();
  else if (ui.tab === 'calendar') renderCalendar();
  else if (ui.tab === 'ops') renderOps();
  else if (ui.tab === 'more') renderMore();
}

/** À appeler après toute modification des données. */
function commit(msg) {
  save();
  render();
  if (msg) toast(msg);
}

/* ---------- Panneau du bas ---------- */

function openSheet(title, html, onClose) {
  $('sheetTitle').textContent = title;
  $('sheetBody').innerHTML = html;
  $('sheetBody').scrollTop = 0;
  ui.sheetOnClose = onClose || null;
  $('scrim').classList.add('open');
  $('sheet').classList.add('open');
}

function closeSheet() {
  $('scrim').classList.remove('open');
  $('sheet').classList.remove('open');
  if (ui.sheetOnClose) ui.sheetOnClose();
  ui.sheetOnClose = null;
}

/** Fermeture par glissement vers le bas depuis l'en-tête du panneau. */
function initSheetGesture() {
  const sheet = $('sheet');
  let y0 = null;
  let dy = 0;
  const handle = (e) => e.target.closest('.sheet-grip, .sheet-head');
  sheet.addEventListener('touchstart', (e) => {
    if (!handle(e)) return;
    y0 = e.touches[0].clientY;
    dy = 0;
    sheet.style.transition = 'none';
  }, { passive: true });
  sheet.addEventListener('touchmove', (e) => {
    if (y0 === null) return;
    dy = Math.max(0, e.touches[0].clientY - y0);
    sheet.style.transform = 'translateY(' + dy + 'px)';
  }, { passive: true });
  sheet.addEventListener('touchend', () => {
    if (y0 === null) return;
    sheet.style.transition = '';
    sheet.style.transform = '';
    y0 = null;
    if (dy > 90) closeSheet();
  });
}

/** Valeur d'un champ du panneau. */
function fv(id) {
  const el = $(id);
  return el ? el.value : '';
}

/* ---------- Petits composants HTML ---------- */

function field(label, inner) {
  return '<label class="field">' + label + '</label>' + inner;
}

function input(id, attrs) {
  return '<input id="' + id + '" ' + (attrs || '') + '>';
}

function amountInput(id, value, extra) {
  return '<input id="' + id + '" type="text" inputmode="decimal" autocomplete="off" placeholder="0,00" value="'
    + (value ? String(value).replace('.', ',') : '') + '" ' + (extra || '') + '>';
}

function selectHTML(id, options, current, attrs) {
  return '<select id="' + id + '" ' + (attrs || '') + '>' + options.map((o) => {
    const v = Array.isArray(o) ? o[0] : o;
    const l = Array.isArray(o) ? o[1] : o;
    return '<option value="' + esc(v) + '"' + (String(v) === String(current) ? ' selected' : '') + '>' + esc(l) + '</option>';
  }).join('') + '</select>';
}

function stat(k, v, cls) {
  return '<div class="stat"><div class="k">' + k + '</div><div class="v ' + (cls || '') + '">' + v + '</div></div>';
}

/* ---------- Date cible (une seule pour toute l'application) ---------- */

function targetControlHTML(prefix) {
  const td = targetDate();
  const quick = [[30, '1 mois'], [90, '3 mois'], [180, '6 mois'], [365, '12 mois']];
  return '<div class="row" style="gap:8px">'
    + '<label class="field" style="margin:0;white-space:nowrap" for="' + prefix + 'Target">Jusqu’au</label>'
    + '<input id="' + prefix + 'Target" type="date" value="' + td + '" min="' + addDaysISO(state.settings.startDate, 1)
    + '" onchange="setTargetDate(this.value)">'
    + '</div><div class="chips" style="margin-top:8px">'
    + quick.map((q) => {
      const on = targetDate() === addDaysISO(todayISO(), q[0]);
      return '<button type="button" class="chip' + (on ? ' on' : '') + '" onclick="setTargetQuick(' + q[0] + ')">' + q[1] + '</button>';
    }).join('')
    + '</div>';
}

function addDaysISO(isoStr, n) {
  return iso(addDays(dateObj(isoStr), n));
}

function setTargetDate(v) {
  if (!v) return;
  if (v <= state.settings.startDate || v <= todayISO()) {
    toast('La date cible doit être dans le futur');
    render();
    return;
  }
  state.settings.targetDate = v;
  commit();
}

function setTargetQuick(n) {
  setTargetDate(addDaysISO(todayISO(), n));
}

/* ---------- Liste jour par jour ---------- */

function dayListHTML(rows, opts) {
  opts = opts || {};
  const days = groupByDay(rows);
  if (!days.length) return '<div class="empty">' + (opts.empty || 'Aucune opération sur cette période.') + '</div>';
  const alert = parseAmount(state.settings.alertThreshold);
  const today = todayISO();

  return days.map((d) => {
    const balCls = d.balance < 0 ? 'neg' : d.balance < alert ? 'low' : '';
    const label = d.date === today ? 'Aujourd’hui' : fmtDay(d.date);
    return '<div class="day"><div class="day-head"><span>' + label + '</span><span class="bal ' + balCls + '">'
      + euro(d.balance) + '</span></div><div class="day-body list">'
      + d.rows.map(opRowHTML).join('') + '</div></div>';
  }).join('');
}

function opRowHTML(r) {
  const inc = r.type === 'income';
  const title = r.kind === 'P' ? 'Ponctuelle' : r.kind === 'E' ? 'Épargne' : 'Récurrente';
  return '<div class="li tap" onclick="openOpSource(\'' + r.src + '\',\'' + esc(r.ref) + '\')">'
    + '<span class="tag ' + r.kind + '" title="' + title + '">' + r.kind + '</span>'
    + '<div class="main"><div class="t">' + esc(r.label) + '</div><div class="s">' + esc(r.category || '—') + '</div></div>'
    + '<div class="amt ' + (inc ? 'pos' : 'neg') + '">' + (inc ? '+' : '−') + euro(r.amount) + '</div></div>';
}

/** Ouvre l'éditeur adapté à l'origine d'une opération. */
function openOpSource(src, ref) {
  if (src === 'rec') editExpense(ref);
  else if (src === 'inc') editIncome(ref);
  else if (src === 'one') editOneoff(ref);
  else if (src === 'groc') openGrocerySheet();
  else if (src === 'sav') {
    showTab('more');
    openMore('savings');
  }
}

/* ---------- Démarrage ---------- */

/* =========================================================
   RENDU — Aujourd'hui et Calendrier
   ========================================================= */

function renderToday() {
  const st = state.settings;
  const p = projection();
  const ds = dailyStats(p);
  const alert = parseAmount(st.alertThreshold);

  $('todayHero').innerHTML =
    '<div class="label">Solde projeté au ' + fmtDate(p.to) + '</div>'
    + '<div class="big num">' + euro(p.end) + '</div>'
    + '<div class="sub">Aujourd’hui (estimé) ' + euro(p.anchorBal) + ' · départ ' + euro(p.start) + ' le ' + fmtShort(p.from) + '</div>';

  $('todayStats').innerHTML =
    stat('Reste à vivre / j', euro(ds.safe), ds.safe > 0 ? 'pos' : 'neg')
    + stat('Point bas', euro0(p.fLow), p.fLow < 0 ? 'neg' : p.fLow < alert ? 'warn-txt' : '')
    + stat('Sorties moy. / j', euro(ds.avgFuture))
    + stat('Entrées', euro0(p.fIn), 'pos')
    + stat('Sorties', euro0(p.fExp + p.fSav), 'neg')
    + stat('dont épargne', euro0(p.fSav));

  $('todayHorizonLabel').textContent = ds.N + ' jours';
  $('todayTargetCtl').innerHTML = targetControlHTML('today');
  $('todayChart').innerHTML = projectionChart(p);
  $('todayAlerts').innerHTML = alertsHTML(p);

  const limit = addDaysISO(todayISO(), 6);
  const next = p.future.filter((r) => r.date <= limit);
  $('todayDays').innerHTML = dayListHTML(next, { empty: 'Aucune opération dans les 7 prochains jours.' });
}

function alertsHTML(p) {
  const st = state.settings;
  const alert = parseAmount(st.alertThreshold);
  const out = [];

  if (p.fLow < 0) {
    out.push('<div class="alert bad">Solde négatif le <b>' + fmtDate(p.fLowDate) + '</b> : point bas à <b>' + euro(p.fLow) + '</b>.</div>');
  } else if (p.fLow < alert) {
    out.push('<div class="alert">Sous le seuil d’alerte le <b>' + fmtDate(p.fLowDate) + '</b> : point bas à <b>' + euro(p.fLow) + '</b>.</div>');
  }
  if (!incomes().length) {
    out.push('<div class="alert">Aucune entrée saisie : ajoute salaires, loyers et allocations dans Opérations › Entrées.</div>');
  }
  const ageStart = daysBetween(st.startDate, todayISO());
  if (ageStart > 7) {
    out.push('<div class="alert">Le solde de départ date du ' + fmtDate(st.startDate) + ' (' + ageStart
      + ' jours) : la projection rejoue les opérations depuis. <a href="#" onclick="openMore(\'data\');return false">Mettre à jour le solde</a></div>');
  }
  const lb = st.lastBackup;
  const age = lb ? daysBetween(lb, todayISO()) : null;
  if (age === null || age >= 7) {
    out.push('<div class="alert">' + (lb ? 'Dernière sauvegarde il y a ' + age + ' jours. ' : 'Aucune sauvegarde pour l’instant. ')
      + '<a href="#" onclick="exportJSON();return false">Exporter maintenant</a></div>');
  }
  return out.join('');
}

function renderCalendar() {
  const p = projection();
  const ds = dailyStats(p);
  const surplus = Math.max(0, Number(state.settings.daySurplus) || 0);
  const sim = surplus > 0 ? simulate(p, surplus) : null;

  $('calTargetCtl').innerHTML = targetControlHTML('cal');
  $('calChart').innerHTML = '<div class="chart-cap">Engagé (trait plein)' + (sim ? ' · simulé (pointillé)' : '') + '</div>'
    + projectionChart(p, sim);
  $('calSim').innerHTML = simulatorHTML(p, ds, surplus);
  $('calSummary').textContent = p.future.length + ' opérations · ' + euro(ds.avgFuture) + ' / j';
  $('calDays').innerHTML = dayListHTML(p.future);
}

function simulatorHTML(p, ds, surplus) {
  const sim = simulate(p, surplus);
  const max = Math.max(30, Math.ceil(ds.safe * 2) + 10, Math.ceil((ds.real || 0) * 1.5));

  return '<div class="card-head"><h2>Budget journalier</h2><span class="muted">' + ds.N + ' jours</span></div>'
    + '<div class="grid3">'
    + stat('Plancher / j', euro(ds.floor))
    + stat('Imprévus réels / j', ds.real == null ? '—' : euro(ds.real))
    + stat('Max sûr / j', euro(ds.safe), 'pos')
    + '</div>'
    + '<div class="muted" style="margin-top:6px">Plancher : récurrentes ' + euro(ds.floorParts.rec) + ' · courses '
    + euro(ds.floorParts.groc) + ' · ponctuelles ' + euro(ds.floorParts.one) + ' · épargne ' + euro(ds.floorParts.sav) + '</div>'
    + '<label class="field">Imprévu simulé : <b class="num" id="simLabel" style="color:var(--txt)">' + euro(surplus) + ' / jour</b></label>'
    + '<input type="range" min="0" max="' + max + '" step="1" value="' + Math.min(surplus, max) + '" oninput="setSurplus(this.value,true)" onchange="setSurplus(this.value)">'
    + '<div class="row wrap" style="margin-top:8px">'
    + '<button class="btn sm ghost" type="button" onclick="setSurplus(0)">Zéro</button>'
    + '<button class="btn sm ghost" type="button" onclick="setSurplus(' + Math.round(ds.real || 0) + ')">= réel</button>'
    + '<button class="btn sm ghost" type="button" onclick="setSurplus(' + Math.floor(ds.safe) + ')">Max sûr</button>'
    + '</div>'
    + '<div id="simResult">' + simResultHTML(p, sim) + '</div>';
}

function simResultHTML(p, sim) {
  const alert = parseAmount(state.settings.alertThreshold);
  const dayOf = (t) => fmtDate(addDaysISO(p.anchor, t));
  let verdict;
  if (sim.firstZero !== null) verdict = '<div class="alert bad">Solde négatif dès le ' + dayOf(sim.firstZero) + '.</div>';
  else if (sim.firstAlert !== null) verdict = '<div class="alert">Sous le seuil d’alerte dès le ' + dayOf(sim.firstAlert) + '.</div>';
  else verdict = '<div class="alert ok">Au-dessus du seuil d’alerte sur toute la période.</div>';
  return '<div class="muted" style="margin-top:10px">Impact sur la période : <b>' + euro(sim.impact) + '</b> · solde final <b class="'
    + (sim.end < 0 ? 'neg' : '') + '">' + euro(sim.end) + '</b> · point bas <b class="' + (sim.low < alert ? 'neg' : '') + '">'
    + euro(sim.low) + '</b></div>'
    + '<div style="margin-top:8px">' + verdict + '</div>';
}

let surplusTimer = null;

/** Curseur du simulateur : rendu différé pendant le glissement pour rester fluide. */
function setSurplus(v, live) {
  state.settings.daySurplus = Math.max(0, Number(v) || 0);
  clearTimeout(surplusTimer);
  if (live) {
    surplusTimer = setTimeout(updateSimLive, 40);
    return;
  }
  commit();
}

/** Met à jour la courbe et le résultat sans reconstruire le curseur. */
function updateSimLive() {
  const p = projection();
  const surplus = state.settings.daySurplus;
  const sim = simulate(p, surplus);
  $('simLabel').textContent = euro(surplus) + ' / jour';
  $('simResult').innerHTML = simResultHTML(p, sim);
  $('calChart').innerHTML = '<div class="chart-cap">Engagé (trait plein)' + (surplus > 0 ? ' · simulé (pointillé)' : '') + '</div>'
    + projectionChart(p, surplus > 0 ? sim : null);
}

/* =========================================================
   RENDU + INTERACTIONS — Opérations (sorties, entrées, ponctuelles)
   et saisie rapide (bouton +)
   ========================================================= */

const opsState = {
  expSort: 'amount_desc',
  closed: new Set(), // groupes repliés
};

const SORTS = [
  ['amount_desc', 'Montant ↓'],
  ['amount_asc', 'Montant ↑'],
  ['day', 'Jour'],
  ['label', 'A → Z'],
];

function renderOps() {
  const body = $('opsBody');
  if (ui.opsView === 'income') body.innerHTML = incomeViewHTML();
  else if (ui.opsView === 'oneoff') body.innerHTML = oneoffViewHTML();
  else body.innerHTML = expenseViewHTML();
}

function toggleGroup(el) {
  const k = el.dataset.k;
  if (el.open) opsState.closed.delete(k);
  else opsState.closed.add(k);
}

function groupHTML(key, title, pill, inner) {
  const open = !opsState.closed.has(key);
  return '<details class="group" data-k="' + esc(key) + '" ontoggle="toggleGroup(this)"' + (open ? ' open' : '') + '>'
    + '<summary><span class="grow">' + esc(title) + '</span>' + pill + '</summary>'
    + '<div class="list" style="padding-bottom:6px">' + inner + '</div></details>';
}

/* ---------- Sorties récurrentes ---------- */

function expenseViewHTML() {
  const exp = expensesRec();
  const total = monthlyCharges();
  const g = state.settings.grocery;
  const grocMonthly = g && g.active ? (Number(g.amount) || 0) * 52 / 12 : 0;
  const sortFn = {
    amount_desc: (a, b) => b.amount - a.amount,
    amount_asc: (a, b) => a.amount - b.amount,
    day: (a, b) => a.day - b.day,
    label: (a, b) => String(a.label).localeCompare(b.label),
  }[opsState.expSort];
  const cats = [...new Set(exp.map((r) => r.category || 'Divers'))]
    .map((c) => ({ c, rows: exp.filter((r) => (r.category || 'Divers') === c) }))
    .map((x) => Object.assign(x, { sub: sum(x.rows, (r) => r.amount) }))
    .sort((a, b) => b.sub - a.sub);

  let html = '<div class="card"><div class="card-head"><h2>Par mois</h2><span class="pill neg">' + euro(total + grocMonthly) + '</span></div>'
    + '<div class="muted">Récurrentes ' + euro(total) + (grocMonthly ? ' · courses hebdo ≈ ' + euro(grocMonthly) : '') + ' · hors épargne</div>'
    + '<div class="chart" style="margin-top:8px">' + barSVG(expenseMonthly(), { color: 'var(--neg)' }) + '</div></div>';

  html += '<div class="row between" style="margin:14px 2px 6px"><div class="chips">'
    + SORTS.map((s) => '<button type="button" class="chip' + (opsState.expSort === s[0] ? ' on' : '') + '" onclick="opsState.expSort=\'' + s[0] + '\';renderOps()">' + s[1] + '</button>').join('')
    + '</div></div>';

  if (!exp.length) {
    html += '<div class="empty">Aucune sortie récurrente.</div>';
  } else {
    html += '<div class="card" style="padding:4px 14px">' + cats.map((x) => {
      const rows = x.rows.slice().sort(sortFn).map((r) => {
        const frac = x.sub ? r.amount / x.sub : 0;
        return '<div class="li tap" onclick="editExpense(\'' + r.id + '\')"><div class="main">'
          + '<div class="row between"><span class="t">' + esc(r.label) + '</span><span class="amt neg">−' + euro(r.amount) + '</span></div>'
          + '<div class="s">Le ' + r.day + ' · ' + Math.round(frac * 100) + ' % de la catégorie' + (r.end ? ' · fin ' + fmtDate(r.end) : '') + '</div>'
          + dataBar(frac, 'var(--neg)') + '</div></div>';
      }).join('');
      return groupHTML('exp:' + x.c, x.c, '<span class="pill neg">' + euro(x.sub) + '</span>', rows);
    }).join('') + '</div>';
  }

  html += '<button class="btn block" type="button" style="margin-top:12px" onclick="editExpense(null)">Nouvelle sortie récurrente</button>';
  return html;
}

function editExpense(id) {
  const r = id ? state.recurring.find((x) => x.id === id) : null;
  const cats = [...new Set(expensesRec().map((x) => x.category || 'Divers'))].sort();
  const html =
    field('Libellé', input('f_label', 'value="' + esc(r ? r.label : '') + '" placeholder="Crédit, assurance, abonnement…"'))
    + '<div class="grid2"><div>' + field('Montant (€)', amountInput('f_amount', r ? r.amount : ''))
    + '</div><div>' + field('Jour du mois', input('f_day', 'type="number" inputmode="numeric" min="1" max="31" value="' + (r ? r.day : 5) + '"')) + '</div></div>'
    + field('Catégorie', input('f_cat', 'list="dl_cats" value="' + esc(r ? r.category : '') + '" placeholder="Crédit, Assurance…"'))
    + '<datalist id="dl_cats">' + cats.map((c) => '<option value="' + esc(c) + '">').join('') + '</datalist>'
    + '<div class="grid2"><div>' + field('Début', input('f_start', 'type="date" value="' + (r ? r.start || '' : todayISO()) + '"'))
    + '</div><div>' + field('Fin (facultatif)', input('f_end', 'type="date" value="' + (r ? r.end || '' : '') + '"')) + '</div></div>'
    + '<button class="btn block" type="button" style="margin-top:16px" onclick="saveExpense(' + (r ? '\'' + r.id + '\'' : 'null') + ')">Enregistrer</button>'
    + (r ? '<button class="btn block danger" type="button" style="margin-top:8px" onclick="deleteItem(\'recurring\',\'' + r.id + '\')">Supprimer</button>' : '');
  openSheet(r ? 'Modifier la sortie' : 'Nouvelle sortie récurrente', html);
}

function saveExpense(id) {
  const amount = Math.abs(parseAmount(fv('f_amount')));
  if (!amount) return toast('Montant manquant');
  const data = {
    label: fv('f_label').trim() || 'Sans libellé',
    amount,
    day: Math.min(31, Math.max(1, Number(fv('f_day')) || 1)),
    category: fv('f_cat').trim() || 'Divers',
    start: fv('f_start') || todayISO(),
    end: fv('f_end') || '',
  };
  if (id) Object.assign(state.recurring.find((x) => x.id === id), data);
  else state.recurring.push(Object.assign({ id: uid(), type: 'expense' }, data));
  closeSheet();
  commit('Sortie enregistrée');
}

function deleteItem(coll, id) {
  if (!confirm('Supprimer définitivement cet élément ?')) return;
  state[coll] = state[coll].filter((x) => x.id !== id);
  closeSheet();
  commit('Supprimé');
}

/* ---------- Entrées ---------- */

function incomeViewHTML() {
  const cm = todayISO().slice(0, 7);
  const list = incomes();
  const fams = incCats().slice();
  list.forEach((r) => { if (!fams.includes(r.category)) fams.push(r.category); });

  let html = '<div class="card"><div class="card-head"><h2>Ce mois-ci</h2><span class="pill pos">' + euro(incMonthTotal(cm)) + '</span></div>'
    + '<div class="muted">' + list.length + ' entrée(s) · ' + monthNameFR(cm) + '</div>'
    + '<div class="chart" style="margin-top:8px">' + barSVG(incomeMonthly(), { color: 'var(--pos)' }) + '</div></div>';

  html += '<div class="card" style="padding:4px 14px;margin-top:12px">' + fams.map((cat) => {
    const rows = list.filter((r) => r.category === cat);
    const sub = sum(rows, (r) => incLineAt(r, cm));
    const inner = rows.length ? rows.map((r) => {
      const sch = (r.schedule || []).slice().sort((a, b) => a.ym.localeCompare(b.ym));
      const cur = incLineAt(r, cm);
      const range = sch.length ? ymShort(sch[0].ym) + ' → ' + ymShort(sch[sch.length - 1].ym) : 'aucun mois';
      return '<div class="li tap" onclick="editIncome(\'' + r.id + '\')"><div class="main">'
        + '<div class="row between"><span class="t">' + esc(r.label) + '</span><span class="amt pos">' + (cur ? '+' + euro(cur) : '—') + '</span></div>'
        + '<div class="s">Le ' + r.day + ' · ' + range + (sub && cur ? ' · ' + Math.round((cur / sub) * 100) + ' %' : '') + '</div>'
        + (cur ? dataBar(sub ? cur / sub : 0, 'var(--pos)') : '') + '</div></div>';
    }).join('') : '<div class="muted" style="padding:8px 0">Aucune entrée dans cette famille.</div>';
    return groupHTML('inc:' + cat, cat, '<span class="pill pos">' + euro(sub) + '</span>', inner);
  }).join('') + '</div>';

  html += '<div class="grid2" style="margin-top:12px">'
    + '<button class="btn" type="button" onclick="editIncome(null)">Nouvelle entrée</button>'
    + '<button class="btn ghost" type="button" onclick="openFamilies()">Familles</button></div>';
  return html;
}

let incDraft = null;

function editIncome(id) {
  const r = id ? state.recurring.find((x) => x.id === id) : null;
  incDraft = r
    ? { id: r.id, category: r.category, label: r.label, day: r.day, schedule: r.schedule.map((l) => ({ ym: l.ym, amount: l.amount })) }
    : { id: null, category: incCats()[0], label: '', day: 27, schedule: [] };
  renderIncomeSheet();
}

function renderIncomeSheet() {
  const d = incDraft;
  const cats = incCats().slice();
  if (!cats.includes(d.category)) cats.push(d.category);
  const html =
    '<div class="grid2"><div>' + field('Famille', selectHTML('f_cat', cats, d.category, 'onchange="incDraft.category=this.value"'))
    + '</div><div>' + field('Jour de versement', input('f_day', 'type="number" inputmode="numeric" min="1" max="31" value="' + d.day + '" onchange="incDraft.day=Number(this.value)||27"')) + '</div></div>'
    + field('Libellé', input('f_label', 'value="' + esc(d.label) + '" placeholder="Salaire, loyer…" oninput="incDraft.label=this.value"'))
    + '<h3>Remplir plusieurs mois</h3><div class="card flat"><div class="grid3">'
    + '<div>' + field('Montant', amountInput('f_rep_amount', '')) + '</div>'
    + '<div>' + field('Nb de mois', input('f_rep_n', 'type="number" inputmode="numeric" min="1" max="36" value="12"')) + '</div>'
    + '<div>' + field('À partir de', input('f_rep_start', 'type="month" value="' + todayISO().slice(0, 7) + '"')) + '</div></div>'
    + '<button class="btn sm block" type="button" style="margin-top:10px" onclick="incReplicate()">Répliquer</button></div>'
    + '<h3>Montants par mois</h3><div id="incLines"></div>'
    + '<div class="row" style="margin-top:8px">' + input('f_add_month', 'type="month" style="flex:1"') + amountInput('f_add_amount', '', 'style="flex:1"')
    + '<button class="btn sm ghost" type="button" onclick="incAddLine()">Ajouter</button></div>'
    + '<button class="btn block" type="button" style="margin-top:16px" onclick="saveIncome()">Enregistrer</button>'
    + (d.id ? '<div class="grid2" style="margin-top:8px"><button class="btn ghost" type="button" onclick="duplicateIncome(\'' + d.id + '\')">Dupliquer</button>'
      + '<button class="btn danger" type="button" onclick="deleteItem(\'recurring\',\'' + d.id + '\')">Supprimer</button></div>' : '');
  openSheet(d.id ? 'Modifier l’entrée' : 'Nouvelle entrée', html, () => { incDraft = null; });
  renderIncLines();
}

function renderIncLines() {
  const el = $('incLines');
  if (!el || !incDraft) return;
  const lines = incDraft.schedule.slice().sort((a, b) => a.ym.localeCompare(b.ym));
  el.innerHTML = lines.length ? '<div class="list">' + lines.map((l) =>
    '<div class="li"><div class="main t">' + monthNameFR(l.ym) + '</div>'
    + '<input type="text" inputmode="decimal" style="width:120px;text-align:right" value="' + String(l.amount).replace('.', ',')
    + '" onchange="incLineSet(\'' + l.ym + '\',this.value)">'
    + '<button class="btn sm ghost" type="button" aria-label="Retirer" onclick="incLineDel(\'' + l.ym + '\')">✕</button></div>').join('') + '</div>'
    : '<div class="empty">Aucun mois renseigné : utilise « Répliquer » ou ajoute un mois.</div>';
}

function incLineSet(ym, val) {
  const a = Math.abs(parseAmount(val));
  const l = incDraft.schedule.find((x) => x.ym === ym);
  if (l) l.amount = a;
  else incDraft.schedule.push({ ym, amount: a });
  renderIncLines();
}

function incLineDel(ym) {
  incDraft.schedule = incDraft.schedule.filter((x) => x.ym !== ym);
  renderIncLines();
}

function incAddLine() {
  const ym = fv('f_add_month');
  if (!ym) return toast('Choisis un mois');
  incLineSet(ym, fv('f_add_amount'));
  $('f_add_amount').value = '';
}

function incReplicate() {
  const a = Math.abs(parseAmount(fv('f_rep_amount')));
  const n = Math.min(36, Math.max(1, Number(fv('f_rep_n')) || 1));
  const start = fv('f_rep_start') || todayISO().slice(0, 7);
  if (!a) return toast('Montant à répliquer manquant');
  for (let i = 0; i < n; i++) {
    const ym = addMonthsYm(start, i);
    const l = incDraft.schedule.find((x) => x.ym === ym);
    if (l) l.amount = a;
    else incDraft.schedule.push({ ym, amount: a });
  }
  renderIncLines();
  toast(n + ' mois remplis');
}

function saveIncome() {
  const d = incDraft;
  d.label = fv('f_label').trim();
  if (!d.label) return toast('Libellé manquant');
  const data = {
    type: 'income',
    category: d.category,
    label: d.label,
    day: Math.min(31, Math.max(1, Number(fv('f_day')) || 27)),
    schedule: d.schedule.filter((l) => l.ym && l.amount > 0).sort((a, b) => a.ym.localeCompare(b.ym)),
  };
  if (d.id) Object.assign(state.recurring.find((x) => x.id === d.id), data);
  else state.recurring.push(Object.assign({ id: uid() }, data));
  closeSheet();
  commit('Entrée enregistrée');
}

function duplicateIncome(id) {
  const r = state.recurring.find((x) => x.id === id);
  if (!r) return;
  const c = JSON.parse(JSON.stringify(r));
  c.id = uid();
  c.label = r.label + ' (copie)';
  state.recurring.push(c);
  closeSheet();
  commit('Entrée dupliquée');
}

/* Familles d'entrées */

function openFamilies() {
  const cats = incCats();
  const counts = {};
  incomes().forEach((r) => { counts[r.category] = (counts[r.category] || 0) + 1; });
  const html = '<div class="list">' + cats.map((c, i) =>
    '<div class="li"><div class="main"><div class="t">' + esc(c) + '</div><div class="s">' + (counts[c] || 0) + ' entrée(s)</div></div>'
    + '<button class="btn sm ghost" type="button" onclick="renameFamily(' + i + ')">Renommer</button>'
    + (c === 'Autres' ? '' : '<button class="btn sm danger" type="button" onclick="deleteFamily(' + i + ')">✕</button>')
    + '</div>').join('') + '</div>'
    + '<div class="row" style="margin-top:12px">' + input('f_newcat', 'placeholder="Nouvelle famille" style="flex:1"')
    + '<button class="btn" type="button" onclick="addFamily()">Créer</button></div>';
  openSheet('Familles d’entrées', html);
}

function addFamily() {
  const n = fv('f_newcat').trim();
  if (!n) return toast('Nom manquant');
  if (!incCats().includes(n)) incCats().push(n);
  save();
  openFamilies();
  render();
}

function renameFamily(i) {
  const cats = incCats();
  const old = cats[i];
  const v = prompt('Renommer « ' + old + ' » en :', old);
  const name = v && v.trim();
  if (!name || name === old) return;
  if (cats.includes(name)) cats.splice(i, 1);
  else cats[i] = name;
  incomes().forEach((r) => { if (r.category === old) r.category = name; });
  save();
  openFamilies();
  render();
}

function deleteFamily(i) {
  const cats = incCats();
  const name = cats[i];
  if (!confirm('Supprimer la famille « ' + name + ' » ? Ses entrées passeront dans « Autres ».')) return;
  if (!cats.includes('Autres')) cats.push('Autres');
  incomes().forEach((r) => { if (r.category === name) r.category = 'Autres'; });
  cats.splice(cats.indexOf(name), 1);
  save();
  openFamilies();
  render();
}

function oneoffViewHTML() {
  const today = todayISO();
  const rows = state.oneoffs.slice().sort((a, b) => a.date.localeCompare(b.date));
  const future = rows.filter((o) => o.date >= today);
  const past = rows.filter((o) => o.date < today).reverse();
  const rowHTML = (o) => {
    const inc = o.type === 'income';
    return '<div class="li tap" onclick="editOneoff(\'' + o.id + '\')"><span class="tag ' + (o.type === 'saving' ? 'E' : 'P') + '">'
      + (o.type === 'saving' ? 'E' : 'P') + '</span><div class="main"><div class="t">' + esc(o.label) + '</div><div class="s">'
      + fmtDate(o.date) + ' · ' + esc(o.category) + '</div></div><div class="amt ' + (inc ? 'pos' : 'neg') + '">'
      + (inc ? '+' : '−') + euro(o.amount) + '</div></div>';
  };
  let html = '<div class="card" style="padding:4px 14px">'
    + groupHTML('one:future', 'À venir', '<span class="pill">' + future.length + '</span>',

      past.length ? past.map(rowHTML).join('') : '<div class="muted" style="padding:8px 0">Aucune.</div>')

    html += '<button class="btn block ghost" type="button" style="margin-top:12px" onclick="purgePast()">Supprimer les ponctuelles passées</button>';

function editOneoff(id) {

function segPick(btn) {
  btn.parentElement.querySelectorAll('button').forEach((b) => b.classList.toggle('on', b === btn));
  if (btn.parentElement.id === 'q_typeSeg') renderQuickCats();
}

function segValue(id) {
  const b = document.querySelector('#' + id + ' button.on');
  return b ? b.dataset.v : '';
}

function saveOneoff(id) {
  const o = state.oneoffs.find((x) => x.id === id);
  const amount = Math.abs(parseAmount(fv('f_amount')));
  if (!amount) return toast('Montant manquant');
  Object.assign(o, {
    type: segValue('f_typeSeg') || 'expense',
    amount,
    label: fv('f_label').trim() || 'Sans libellé',
    category: fv('f_cat').trim() || 'Divers',
    date: fv('f_date') || todayISO(),
  });
  closeSheet();
  commit('Opération enregistrée');
}

function purgePast() {
  const today = todayISO();
  const n = state.oneoffs.filter((o) => o.date < today).length;
  if (!n || !confirm('Supprimer les ' + n + ' opération(s) ponctuelle(s) passée(s) ?')) return;
  state.oneoffs = state.oneoffs.filter((o) => o.date >= today);
  commit(n + ' ligne(s) supprimée(s)');
}

/* ---------- Saisie rapide (bouton +) ---------- */

function recentCategories(type) {
  const seen = [];
  const push = (c) => { if (c && !seen.includes(c)) seen.push(c); };
  state.oneoffs.filter((o) => o.type === type).slice().reverse().forEach((o) => push(o.category));
  if (type === 'income') incCats().forEach(push);
  else ['Courses', 'Carburant', 'Restaurant', 'Santé', 'Loisirs', 'Maison', 'Enfants', 'Divers'].forEach(push);
  return seen.slice(0, 10);
}

  const html =

  document.querySelectorAll('#q_cats .chip').forEach((b) => b.classList.remove('on'));
  btn.classList.toggle('on', on);

function saveQuick() {
  const type = segValue('q_typeSeg') || 'expense';
  const amount = Math.abs(parseAmount(fv('q_amount')));
  if (!amount) return toast('Montant manquant');
  const category = fv('q_cat').trim() || (type === 'income' ? 'Autres' : 'Divers');
  const label = fv('q_label').trim() || category;
  const date = fv('q_date') || todayISO();

  if ($('q_rec').checked) {
    const day = Math.min(31, Math.max(1, Number(fv('q_day')) || 1));
    if (type === 'income') {
      if (!incCats().includes(category)) incCats().push(category);
      state.recurring.push({ id: uid(), type: 'income', category, label, day, schedule: genMonths(date.slice(0, 7), 12, amount) });
    } else {
      state.recurring.push({ id: uid(), type: 'expense', label, amount, day, category, start: date, end: '' });
    }
  } else {
    state.oneoffs.push({ id: uid(), type, label, amount, date, category });
  }
  closeSheet();
  commit((type === 'income' ? 'Entrée' : 'Dépense') + ' enregistrée');
}

function saveSettingsForm() {
